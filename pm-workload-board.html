    --text-faint:       #64748B;          /* was #94A3B8 — was nearly invisible on white */
    --text-muted:       #1E293B;          /* was #374151                                 */

    --input-bg:         #FFFFFF;
    --card-bg:          #F1F5F9;
    --btn-bg:           #E2E8F0;
    --btn-color:        #1E293B;          /* was #374151 — stronger button labels        */
    --heat-0:           #E2E8F0;
    --heat-1:           #DBEAFE;
    --heat-2:           #FEF3C7;
    --heat-3:           #FED7AA;
    --heat-4:           #FECACA;
    --heat-fg-1:        #1E40AF;
    --heat-fg-2:        #78350F;
    --heat-fg-3:        #9A3412;
    --row-alt:          rgba(0,0,0,0.02);
    --weekend-bg:       rgba(0,0,0,0.04);
    --progress-fill:    rgba(0,0,0,0.65);

  }

  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  input, select { color-scheme: inherit; }
  [data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

  @page { size: landscape; }

  @media print {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;

    body * { visibility: hidden; }

    header {
      display: none !important;

    #pm-layout,

<script type="text/babel">

const COLORS = ["#E84855","#3A86FF","#06D6A0","#FFB703","#8338EC","#FF6B35","#4ECDC4","#A78BFA","#F472B6","#34D399"];

const SAMPLE_DATA = {"t":[{"id":"1700001001000","taskName":"Backend integration","projectName":"ERP Migration","resourceIds":["1700000001000","1700000003000"],"startDate":"2026-04-20","endDate":"2026-05-08","notes":"Blocked by missing DB credentials from client IT — follow up Thursday"},{"id":"1700001005000","taskName":"Frontend integration","projectName":"ERP Migration","resourceIds":["1700000002000"],"startDate":"2026-04-27","endDate":"2026-06-12","notes":"Coordinate with John — depends on backend endpoints being ready by 09 May"},{"id":"1700001008000","taskName":"ETL pipelines","projectName":"Data Warehouse","resourceIds":["1700000003000"],"startDate":"2026-05-11","endDate":"2026-06-26","notes":"Waiting for data modeling sign-off before starting. Source system access TBC."},{"id":"1700001011000","taskName":"QA & regression testing","projectName":"Customer Portal","resourceIds":["1700000002000"],"startDate":"2026-05-18","endDate":"2026-06-19","notes":"Test plan ready. Needs staging environment — chasing Marco for deployment."},{"id":"1700001013000","taskName":"Performance optimisation","projectName":"API Gateway","resourceIds":["1700000001000"],"startDate":"2026-06-15","endDate":"2026-07-10","notes":"Target p99 latency < 80ms. Profile with k6 first, then tune connection pooling.","tentative":true},{"id":"1700001014000","taskName":"Mobile screen implementation","projectName":"Mobile App Redesign","resourceIds":["1700000002000"],"startDate":"2026-06-08","endDate":"2026-08-07","notes":"React Native build. Polish pass and handoff QA to follow before release."},{"id":"1700001015000","taskName":"Dashboards & reporting","projectName":"Data Warehouse","resourceIds":["1700000003000","1700000001000"],"startDate":"2026-07-06","endDate":"2026-08-07","notes":"BI layer on top of ETL output. Stakeholder review scheduled mid-July."},{"id":"1700001016000","taskName":"Help-desk rotation","projectName":"Help Desk","resourceIds":["1700000001000","1700000002000","1700000003000"],"startDate":"2026-04-20","endDate":"2026-08-14","allocation":20,"notes":"Permanent support duty — about one day a week each."}],"r":[{"id":"1700000001000","name":"John"},{"id":"1700000002000","name":"Sarah"},{"id":"1700000003000","name":"Marco"}],"m":[{"id":"1700002001000","name":"ERP Go-Live","date":"2026-05-11","color":"#F59E0B"},{"id":"1700002002000","name":"UAT Freeze","date":"2026-06-15","color":"#3A86FF"},{"id":"1700002003000","name":"Mobile Release","date":"2026-08-10","color":"#A78BFA"}],"c":{"ERP Migration":"#E84855","API Gateway":"#3A86FF","Data Warehouse":"#06D6A0","Customer Portal":"#FFB703","Mobile App Redesign":"#8338EC","Help Desk":"#4ECDC4"},"o":[{"id":"1700003001000","resourceId":"1700000002000","startDate":"2026-08-03","endDate":"2026-08-14","label":"Summer holiday"},{"id":"1700003002000","resourceId":"1700000001000","startDate":"2026-05-25","endDate":"2026-05-29","label":"Holiday"}]};
const STORAGE_KEY = "pm-gantt-v2";
const THEME_KEY   = "pm-gantt-theme";
const GRAN_KEY    = "pm-gantt-gran";
const GROUP_KEY   = "pm-gantt-group";
const TENT_KEY    = "pm-gantt-tentative";

// px per calendar day for each granularity
const DAY_PX   = 38;           // day view:   38 px / day
const WEEK_PX  = 80 / 7;       // week view:  80 px / week  → ~11.43 px/day
const MONTH_PX = 120 / 30.44;  // month view: ~120 px / avg-month → ~3.94 px/day
const LABEL_W  = 176;          // fixed label column (Gantt + heatmap)

function parseDate(s) { return new Date(s + "T00:00:00"); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfMonday(d) {
  const r = new Date(d); const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff); r.setHours(0,0,0,0); return r;
}
function fmtShort(d) { return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" }); }
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function getISOWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 86400000 + 1) / 7);
}
// ── effort / load ──────────────────────────────────────────────────────────
// allocation = share of a person's time the task takes (1–100 %, missing = 100)
const ALLOC_PRESETS = [100, 50, 20];
const allocOf = t => (t.allocation > 0 ? Math.min(100, t.allocation) : 100);
const LIGHT_BELOW = 50;                    // effort under this → light "background duty" bar
const clampAlloc = v => Math.min(100, Math.max(1, parseInt(v) || 100));
const OFF_HATCH = "repeating-linear-gradient(45deg, var(--off-stripe) 0 5px, transparent 5px 10px)";
// Heat level from weekly load in % of capacity. With every task at 100 % this
// reproduces the original 1 / 2 / 3 / 4+ parallel-task scale.
const LOAD_STEPS = [100, 200, 300];
const loadLevel = pct => pct <= 0 ? 0 : pct <= LOAD_STEPS[0] ? 1 : pct <= LOAD_STEPS[1] ? 2 : pct <= LOAD_STEPS[2] ? 3 : 4;
const heatBg = n => `var(--heat-${Math.min(n, 4)})`;
const heatFg = n => n===1?"var(--heat-fg-1)": n===2?"var(--heat-fg-2)":"var(--heat-fg-3)";

const storage = {
  get: (key) => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
  set: (key, val) => { try { localStorage.setItem(key, val); } catch {} },
};

function normalizeTasks(rawTasks) {
  return (rawTasks || []).map(({ resourceId, ...t }) => ({
    ...t,
    resourceIds: t.resourceIds || (resourceId ? [resourceId] : []),
  }));
}

// ── URL share encoding (UTF-8 safe base64-url) ────────────────────────────
function encodeBoard(t, r, c, m, o) {
  try {
    const json = JSON.stringify({t, r, c, m, o});
    const bytes = new TextEncoder().encode(json);
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  } catch { return null; }
}
function decodeBoard(encoded) {
  try {
    const b64 = encoded.replace(/-/g,"+").replace(/_/g,"/");
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const d = JSON.parse(new TextDecoder().decode(bytes));
    if (!Array.isArray(d.t) || !Array.isArray(d.r)) return null;
    return d;
  } catch { return null; }
}

// Height of a DOM node, kept current with ResizeObserver (callback ref: survives mount/unmount)
function useMeasuredHeight() {
  const [h, setH] = React.useState(0);
  const roRef = React.useRef(null);
  const ref = React.useCallback(node => {
    if (roRef.current) { roRef.current.disconnect(); roRef.current = null; }
    if (node) {
      setH(node.offsetHeight);
      const ro = new ResizeObserver(() => setH(node.offsetHeight)); ro.observe(node); roRef.current = ro;
    }
  }, []);
  return [ref, h];
}

// Disclosure chevron: points right when closed, rotates down when open
function Chevron({ open, size = 12 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" aria-hidden="true"
      style={{flexShrink:0, color:"var(--text-dim)", transform:`rotate(${open ? 90 : 0}deg)`, transition:"transform 0.15s ease"}}>
      <path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// Collapsible sidebar section header. Lives outside App so it isn't remounted
// on every render (which would also kill the chevron transition).
function ColHdr({ label, count, open, onToggle }) {
  const [hov, setHov] = React.useState(false);
  return (
    <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer", userSelect:"none",
                 padding:"4px 6px", margin:"0 -6px", borderRadius:5,
                 background: hov ? "var(--surface-3)" : "transparent", transition:"background 0.12s"}}
      onClick={onToggle} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      <span style={{fontSize:11, fontWeight:600, color:"var(--text-dimmer)", letterSpacing:"0.12em"}}>{label}{count > 0 ? ` (${count})` : ""}</span>
      <span style={{marginLeft:6, display:"flex"}}><Chevron open={open} /></span>
    </div>
  );
}

function App() {
  const [tasks, setTasks] = React.useState([]);
  const [resources, setResources] = React.useState([]);
  const [pColors, setPColors] = React.useState({});
  const [milestones, setMilestones] = React.useState([]);
  const [timeOff, setTimeOff] = React.useState([]);          // [{id, resourceId, startDate, endDate, label}]
  const [oForm, setOForm] = React.useState({ resourceId:"", startDate:"", endDate:"", label:"" });
  const [offOpen, setOffOpen] = React.useState(() => { try { return localStorage.getItem("pm-gantt-offOpen") === "1"; } catch { return false; } });
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem(THEME_KEY) || "dark"; } catch { return "dark"; }
  });
  const [granularity, setGranularity] = React.useState(() => {
    try { return localStorage.getItem(GRAN_KEY) || "week"; } catch { return "week"; }
  });
  // Tentative tasks: "hide" | "show" (visible, not counted in load) | "count" (what-if: counted)
  const [tentMode, setTentMode] = React.useState(() => {
    try { const v = localStorage.getItem(TENT_KEY); return ["hide","show","count"].includes(v) ? v : "show"; } catch { return "show"; }
  });
  const [groupBy, setGroupBy] = React.useState(() => {
    try { return localStorage.getItem(GROUP_KEY) === "project" ? "project" : "resource"; } catch { return "resource"; }
  });
  const [mainWidth, setMainWidth] = React.useState(800);
  const [view, setView] = React.useState("both");
  const [form, setForm] = React.useState({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"", completion:"", allocation:100, allocTouched:false, tentative:false });
  const [mForm, setMForm] = React.useState({ name:"", date:"", color:"#F59E0B" });
  const [newRes, setNewRes] = React.useState("");
  const [sideOpen, setSideOpen] = React.useState(true);
  const [filterResource, setFilterResource] = React.useState("");
  const [filterProject, setFilterProject] = React.useState("");
  const [resOpen, setResOpen] = React.useState(() => { try { return localStorage.getItem("pm-gantt-resOpen") === "1"; } catch { return false; } });
  const [projOpen, setProjOpen] = React.useState(() => { try { return localStorage.getItem("pm-gantt-projOpen") !== "0"; } catch { return true; } });   // open by default: it's the colour legend
  const [msOpen, setMsOpen] = React.useState(() => { try { return localStorage.getItem("pm-gantt-msOpen") === "1"; } catch { return false; } });
  const [moreOpen, setMoreOpen] = React.useState(() => { try { return localStorage.getItem("pm-gantt-moreOpen") === "1"; } catch { return false; } });
  const [tasksOpen, setTasksOpen] = React.useState(() => { try { const v = localStorage.getItem("pm-gantt-tasksOpen"); return v === null ? true : v === "1"; } catch { return true; } });
  const [undoSnapshot, setUndoSnapshot] = React.useState(null);
  const [editModal, setEditModal] = React.useState(null);  // null or {task fields}
  const [sharedData, setSharedData] = React.useState(null); // decoded board from URL hash
  const [copyToast, setCopyToast] = React.useState(false);  // "Link copied!" feedback

  const mainRef        = React.useRef(null);
  // Section titles stick to the top of <main>; the column headers stick right below them
  const [ganttTitleRef, ganttTitleH] = useMeasuredHeight();
  const [heatTitleRef,  heatTitleH]  = useMeasuredHeight();
  const undoTimerRef   = React.useRef(null);
  const dragRef        = React.useRef(null);
  const lastDragMovedRef = React.useRef(false);
  const ganttScrollRef = React.useRef(null);
  const ganttHeaderRef = React.useRef(null);
  const heatScrollRef  = React.useRef(null);
  const heatHeaderRef  = React.useRef(null);
  const isSyncing      = React.useRef(false);

  // ── pixels per calendar day (drives ALL positioning) ──────────────────────
  const dayW = granularity === 'day'   ? DAY_PX
             : granularity === 'week'  ? WEEK_PX
             :                           MONTH_PX;

  // Keep current dayW accessible inside the drag handler's stale closure
  const dayWRef = React.useRef(dayW);
  React.useEffect(() => { dayWRef.current = dayW; }, [dayW]);

  // ── theme ─────────────────────────────────────────────────────────────────
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }, [theme]);
  const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");

  const changeGranularity = (g) => {
    setGranularity(g);
    try { localStorage.setItem(GRAN_KEY, g); } catch {}
  };

  const changeTentMode = (v) => {
    setTentMode(v);
    try { localStorage.setItem(TENT_KEY, v); } catch {}
  };

  const changeGroupBy = (g) => {
    setGroupBy(g);
    try { localStorage.setItem(GROUP_KEY, g); } catch {}
  };

  // ── scroll sync ───────────────────────────────────────────────────────────
  const handleGanttScroll = React.useCallback(e => {
    const sl = e.currentTarget.scrollLeft;
    if (ganttHeaderRef.current) ganttHeaderRef.current.style.transform = `translateX(-${sl}px)`;
    if (!isSyncing.current) {
      isSyncing.current = true;
      if (heatScrollRef.current)  heatScrollRef.current.scrollLeft = sl;
      if (heatHeaderRef.current)  heatHeaderRef.current.style.transform = `translateX(-${sl}px)`;
      isSyncing.current = false;
    }
  }, []);

  const handleHeatScroll = React.useCallback(e => {
    const sl = e.currentTarget.scrollLeft;
    if (heatHeaderRef.current) heatHeaderRef.current.style.transform = `translateX(-${sl}px)`;
    if (!isSyncing.current) {
      isSyncing.current = true;
      if (ganttScrollRef.current) ganttScrollRef.current.scrollLeft = sl;
      if (ganttHeaderRef.current) ganttHeaderRef.current.style.transform = `translateX(-${sl}px)`;
      isSyncing.current = false;
    }
  }, []);

  // ── storage + shared-board detection ─────────────────────────────────────
  React.useEffect(() => {
    // Shared board via URL hash takes priority over localStorage
    try {
      const hash = location.hash;
      if (hash.startsWith("#board=")) {
        const d = decodeBoard(hash.slice(7));
        if (d) {
          setSharedData(d); sharedRef.current = true;
          setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); setMilestones(d.m||[]); setTimeOff(d.o||[]);
          return;
        }
      }
    } catch {}
    // Normal: load own data from localStorage
    const r = storage.get(STORAGE_KEY);
    if (r) { try { const d = JSON.parse(r.value); setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); setMilestones(d.m||[]); setTimeOff(d.o||[]); } catch {} }
  }, []);

  // While previewing a shared board nothing is written — the viewer's own board stays intact
  const sharedRef = React.useRef(false);
  // Time off rides along with every save; handlers that change it pass it explicitly
  const timeOffRef = React.useRef([]);
  timeOffRef.current = timeOff;
  const persist = (t, r, c, m, o = timeOffRef.current) => { if (!sharedRef.current) storage.set(STORAGE_KEY, JSON.stringify({ t, r, c, m, o })); };

  // ── undo ──────────────────────────────────────────────────────────────────
  const saveUndo = (label, t, r, c, m, o = timeOffRef.current) => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoSnapshot({ label, t, r, c, m, o });
    undoTimerRef.current = setTimeout(() => setUndoSnapshot(null), 5000);
  };
  const performUndo = () => {
    if (!undoSnapshot) return;
    const { t, r, c, m, o } = undoSnapshot;
    setTasks(t); setResources(r); setPColors(c); setMilestones(m); setTimeOff(o||[]);
    persist(t, r, c, m, o||[]);
    setUndoSnapshot(null);
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
  };

  // ── weeks: always Monday-based (used for heatmap + timelineStart) ─────────
  const weeks = React.useMemo(() => {
    const minW = Math.max(8, Math.ceil((mainWidth - LABEL_W) / (dayW * 7)));
    const ws = [];
    if (!tasks.length) {
      let cur = startOfMonday(new Date());
      for (let i=0; i<minW; i++) { ws.push(new Date(cur)); cur = addDays(cur,7); }
      return ws;
    }
    const dates = tasks.flatMap(t => [parseDate(t.startDate), parseDate(t.endDate)]);
    let cur = startOfMonday(new Date(Math.min(...dates)));
    const end = new Date(Math.max(...dates));
    while (cur <= end) { ws.push(new Date(cur)); cur = addDays(cur,7); }
    while (ws.length < minW) ws.push(addDays(ws[ws.length-1],7));
    return ws;
  }, [tasks, mainWidth, dayW]);

  const timelineStart = weeks[0];
  const heatColW      = dayW * 7;            // heatmap column = 1 week in px
  const heatTimelineW = weeks.length * heatColW;

  // ── Gantt columns (granularity-specific) ──────────────────────────────────
  const ganttColumns = React.useMemo(() => {
    if (!weeks.length) return [];
    const tlEnd = addDays(weeks[weeks.length - 1], 7); // exclusive boundary

    if (granularity === 'day') {
      const cols = []; let d = new Date(timelineStart);
      while (d < tlEnd) { cols.push(new Date(d)); d = addDays(d, 1); }
      return cols;
    }
    if (granularity === 'week') {
      return weeks.map(w => new Date(w));
    }
    // month: start from 1st of month that contains timelineStart
    const cols = [];
    let d = new Date(timelineStart.getFullYear(), timelineStart.getMonth(), 1);
    while (d < tlEnd) { cols.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth()+1, 1); }
    return cols;
  }, [weeks, granularity, timelineStart]);

  // Each Gantt column gets {date, left, width} in pixels
  const ganttColPositions = React.useMemo(() => {
    return ganttColumns.map(col => {
      const left = (col - timelineStart) / 86400000 * dayW;
      let width;
      if (granularity === 'day') {
        width = dayW;
      } else if (granularity === 'week') {
        width = dayW * 7;
      } else {
        // calendar month: variable width
        const next = new Date(col.getFullYear(), col.getMonth() + 1, 1);
        width = (next - col) / 86400000 * dayW;
      }
      return { date: col, left, width };
    });
  }, [ganttColumns, timelineStart, dayW, granularity]);

  const ganttTimelineW = React.useMemo(() => {
    if (!ganttColPositions.length) return 0;
    const last = ganttColPositions[ganttColPositions.length - 1];
    return last.left + last.width;
  }, [ganttColPositions]);

  // Both scroll areas share the same total px width so scroll-sync works
  const sharedTimelineW = Math.max(ganttTimelineW, heatTimelineW);

  // ── bar geometry ──────────────────────────────────────────────────────────
  const barStyle = task => {
    const s = parseDate(task.startDate);
    const e = addDays(parseDate(task.endDate), 1);
    const left  = Math.max(0, (s - timelineStart) / 86400000 * dayW);
    const width = Math.max(dayW * 0.5, (e - s) / 86400000 * dayW);
    return { left:`${left}px`, width:`${width}px` };
  };

  const todayLeft = React.useMemo(() => {
    const today = new Date(); today.setHours(0,0,0,0);
    const px = (today - timelineStart) / 86400000 * dayW;
    return (px >= 0 && px <= sharedTimelineW) ? px : null;
  }, [weeks, dayW, sharedTimelineW]);

  // ── heatmap data (always weekly) ──────────────────────────────────────────
  // Days off per person as a Set of "YYYY-MM-DD"
  const offDays = React.useMemo(() => {
    const m = {};
    timeOff.forEach(o => {
      const set = m[o.resourceId] || (m[o.resourceId] = new Set());
      for (let d = parseDate(o.startDate); d <= parseDate(o.endDate); d = addDays(d, 1)) set.add(fmtDate(d));
    });
    return m;
  }, [timeOff]);

  // Each cell: load = Σ effort × days worked ÷ days available (Mon–Fri minus time off).
  // Work doesn't happen on days off; a main task (≥ LIGHT_BELOW effort) falling on them is a conflict.
  const heatmap = React.useMemo(() => resources.map(res => ({
    res,
    cols: weeks.map(ws => {
      const we = addDays(ws,6);
      const off = offDays[res.id];
      const wdays = [];
      for (let d = new Date(ws); d <= we; d = addDays(d, 1)) if (d.getDay() !== 0 && d.getDay() !== 6) wdays.push(fmtDate(d));
      const daysOff = off ? wdays.filter(x => off.has(x)).length : 0;
      const capacity = wdays.length - daysOff;
      const items = tasks
        .filter(t => t.resourceIds.includes(res.id) && parseDate(t.startDate)<=we && parseDate(t.endDate)>=ws)
        .map(task => {
          const tdays = wdays.filter(x => x >= task.startDate && x <= task.endDate);
          const present = off ? tdays.filter(x => !off.has(x)).length : tdays.length;
          const clash = tdays.length - present > 0 && allocOf(task) >= LIGHT_BELOW;
          return { task, pct: capacity ? allocOf(task) * present / capacity : 0, clash };
        })
        .filter(x => !(x.task.tentative && tentMode === "hide"));
      const counted = items.filter(x => !x.task.tentative || tentMode === "count");
      const tentLoad = Math.round(items.filter(x => x.task.tentative).reduce((a, x) => a + x.pct, 0));
      const offLabels = [...new Set(timeOff.filter(o => o.resourceId === res.id && o.startDate <= fmtDate(we) && o.endDate >= fmtDate(ws)).map(o => o.label || "Time off"))];
      return { items: counted, tentItems: items.filter(x => x.task.tentative && tentMode === "show"), tentLoad,
               load: Math.round(counted.reduce((a, x) => a + x.pct, 0)), daysOff, capacity, offLabels,
               clashes: counted.filter(x => x.clash) };
    })
  })), [resources, tasks, weeks, tentMode, offDays, timeOff]);

  // ── data mutations ────────────────────────────────────────────────────────
  const assignColor = (projectName, current) => {
    if (current[projectName]) return current;
    const used = Object.values(current);
    const free = COLORS.find(c => !used.includes(c)) || COLORS[Object.keys(current).length % COLORS.length];
    return { ...current, [projectName]: free };
  };

  const addResource = () => {
    if (!newRes.trim()) return;
    const r = [...resources, { id: Date.now().toString(), name: newRes.trim() }];
    setResources(r); persist(tasks, r, pColors, milestones); setNewRes("");
  };

  const delResource = id => {
    saveUndo("Deleted resource", tasks, resources, pColors, milestones);
    const r = resources.filter(x => x.id!==id);
    const t = tasks
      .map(x => ({ ...x, resourceIds: x.resourceIds.filter(rid => rid!==id) }))
      .filter(x => x.resourceIds.length > 0);
    const o = timeOff.filter(x => x.resourceId !== id);
    setResources(r); setTasks(t); setTimeOff(o); persist(t, r, pColors, milestones, o);

  const submitForm = () => {
    const { id, taskName, projectName, resourceIds, startDate, endDate, notes, completion } = form;
    const allocation = clampAlloc(form.allocation);
