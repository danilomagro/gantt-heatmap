<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PM Workload Board</title>
<meta property="og:title" content="PM Workload Board" />
<meta property="og:description" content="Cross-project Gantt and capacity heatmap tool for PMs managing multiple simultaneous implementations. Single HTML file, no backend, no install." />
<meta property="og:image" content="https://danilomagro.github.io/gantt-heatmap/preview.png" />
<meta property="og:url" content="https://danilomagro.github.io/gantt-heatmap/" />
<meta property="og:type" content="website" />
<!-- Apply saved theme before React mounts to prevent flash -->
<script>try{var t=localStorage.getItem("pm-gantt-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  [data-theme="dark"] {
    --bg:               #0A0F1E;
    --surface:          #111827;
    --surface-2:        #0F172A;
    --surface-3:        #0D1524;
    --border:           #1F2937;
    --border-subtle:    rgba(255,255,255,0.04);
    --text:             #E2E8F0;
    --text-bright:      #F9FAFB;
    --text-dim:         #6B7280;
    --text-dimmer:      #4B5563;
    --text-faint:       #374151;
    --text-muted:       #9CA3AF;
    --text-heatmap-res: #D1D5DB;
    --input-bg:         #0A0F1E;
    --card-bg:          #0A0F1E;
    --btn-bg:           #1F2937;
    --btn-color:        #6B7280;
    --heat-0:           #1E293B;
    --heat-1:           #1E3A5F;
    --heat-2:           #7C3D12;
    --heat-3:           #7F1D1D;
    --heat-4:           #4C0519;
    --heat-fg-1:        #93C5FD;
    --heat-fg-2:        #FDE68A;
    --heat-fg-3:        #FCA5A5;
    --row-alt:          rgba(255,255,255,0.01);
    color-scheme: dark;
  }

  [data-theme="light"] {
    --bg:               #F8FAFC;
    --surface:          #FFFFFF;
    --surface-2:        #E2E8F0;
    --surface-3:        #EEF2F7;
    --border:           #CBD5E1;
    --border-subtle:    rgba(0,0,0,0.06);
    --text:             #0F172A;
    --text-bright:      #020617;
    --text-dim:         #475569;
    --text-dimmer:      #64748B;
    --text-faint:       #94A3B8;
    --text-muted:       #374151;
    --text-heatmap-res: #1E293B;
    --input-bg:         #FFFFFF;
    --card-bg:          #F1F5F9;
    --btn-bg:           #E2E8F0;
    --btn-color:        #374151;
    --heat-0:           #E2E8F0;
    --heat-1:           #DBEAFE;
    --heat-2:           #FEF3C7;
    --heat-3:           #FED7AA;
    --heat-4:           #FECACA;
    --heat-fg-1:        #1E40AF;
    --heat-fg-2:        #78350F;
    --heat-fg-3:        #9A3412;
    --row-alt:          rgba(0,0,0,0.02);
    color-scheme: light;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  input, select { color-scheme: inherit; }
  [data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

  @page { size: landscape; }

  @media print {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;

    body * { visibility: hidden; }

    header {
      display: none !important;
      visibility: hidden !important;
    }

    #pm-layout,
    #pm-layout * {
      visibility: visible;
    }

    #pm-layout {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(100% / 0.95);
      height: auto;
      transform: scale(0.95);
      transform-origin: top center;
    }

    #pm-sidebar,
    #pm-sidebar * {
      visibility: hidden;
    }

    #pm-sidebar {
      flex: 0 0 0 !important;
      width: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: none !important;
    }

    main { overflow: visible !important; }
    [style*="overflow-x: auto"] { overflow: visible !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const COLORS = ["#E84855","#3A86FF","#06D6A0","#FFB703","#8338EC","#FF6B35","#4ECDC4","#A78BFA","#F472B6","#34D399"];
const MILESTONE_COLORS = ["#F59E0B","#EF4444","#06D6A0","#3A86FF","#A78BFA"];
const STORAGE_KEY = "pm-gantt-v2";
const THEME_KEY   = "pm-gantt-theme";
const MIN_WEEK_W  = 80;

function parseDate(s) { return new Date(s + "T00:00:00"); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfMonday(d) {
  const r = new Date(d); const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff); r.setHours(0,0,0,0); return r;
}
function fmtShort(d) { return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" }); }
const heatBg = n => `var(--heat-${Math.min(n, 4)})`;
const heatFg = n => n===1?"var(--heat-fg-1)": n===2?"var(--heat-fg-2)":"var(--heat-fg-3)";

const storage = {
  get: (key) => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
  set: (key, val) => { try { localStorage.setItem(key, val); } catch {} },
};

function normalizeTasks(rawTasks) {
  return (rawTasks || []).map(({ resourceId, ...t }) => ({
    ...t,
    resourceIds: t.resourceIds || (resourceId ? [resourceId] : []),
  }));
}

function App() {
  const [tasks, setTasks] = React.useState([]);
  const [resources, setResources] = React.useState([]);
  const [pColors, setPColors] = React.useState({});
  const [milestones, setMilestones] = React.useState([]);
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem(THEME_KEY) || "dark"; } catch { return "dark"; }
  });
  const [view, setView] = React.useState("both");
  const [form, setForm] = React.useState({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"" });
  const [mForm, setMForm] = React.useState({ name:"", date:"", color:"#F59E0B" });
  const [newRes, setNewRes] = React.useState("");
  const [sideOpen, setSideOpen] = React.useState(true);
  const [filterResource, setFilterResource] = React.useState("");
  const [filterProject, setFilterProject] = React.useState("");
  const [minVisibleWeeks, setMinVisibleWeeks] = React.useState(8);
  const mainRef = React.useRef(null);

  // Scroll sync refs
  const ganttScrollRef = React.useRef(null);
  const ganttHeaderRef = React.useRef(null);
  const heatScrollRef  = React.useRef(null);
  const heatHeaderRef  = React.useRef(null);
  const isSyncing      = React.useRef(false);

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }, [theme]);

  const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");

  const handleGanttScroll = React.useCallback(e => {
    const sl = e.currentTarget.scrollLeft;
    if (ganttHeaderRef.current) ganttHeaderRef.current.style.transform = `translateX(-${sl}px)`;
    if (!isSyncing.current) {
      isSyncing.current = true;
      if (heatScrollRef.current)  heatScrollRef.current.scrollLeft = sl;
      if (heatHeaderRef.current)  heatHeaderRef.current.style.transform = `translateX(-${sl}px)`;
      isSyncing.current = false;
    }
  }, []);

  const handleHeatScroll = React.useCallback(e => {
    const sl = e.currentTarget.scrollLeft;
    if (heatHeaderRef.current) heatHeaderRef.current.style.transform = `translateX(-${sl}px)`;
    if (!isSyncing.current) {
      isSyncing.current = true;
      if (ganttScrollRef.current) ganttScrollRef.current.scrollLeft = sl;
      if (ganttHeaderRef.current) ganttHeaderRef.current.style.transform = `translateX(-${sl}px)`;
      isSyncing.current = false;
    }
  }, []);

  React.useEffect(() => {
    const r = storage.get(STORAGE_KEY);
    if (r) { try { const d = JSON.parse(r.value); setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); setMilestones(d.m||[]); } catch {} }
  }, []);

  const persist = (t, r, c, m) => storage.set(STORAGE_KEY, JSON.stringify({ t, r, c, m }));

  const weeks = React.useMemo(() => {
    const ws = [];
    if (!tasks.length) {
      let cur = startOfMonday(new Date());
      for (let i=0; i<minVisibleWeeks; i++) { ws.push(new Date(cur)); cur = addDays(cur,7); }
      return ws;
    }
    const dates = tasks.flatMap(t => [parseDate(t.startDate), parseDate(t.endDate)]);
    let cur = startOfMonday(new Date(Math.min(...dates)));
    const end = new Date(Math.max(...dates));
    while (cur <= end) { ws.push(new Date(cur)); cur = addDays(cur,7); }
    while (ws.length < minVisibleWeeks) ws.push(addDays(ws[ws.length-1],7));
    return ws;
  }, [tasks, minVisibleWeeks]);

  const timelineStart = weeks[0];
  const timelineWidth = weeks.length * MIN_WEEK_W;
  const dayW = MIN_WEEK_W / 7;

  const barStyle = task => {
    const s = parseDate(task.startDate);
    const e = addDays(parseDate(task.endDate), 1);
    const left = Math.max(0, (s - timelineStart) / 86400000 * dayW);
    const width = Math.max(dayW * 0.5, (e - s) / 86400000 * dayW);
    return { left:`${left}px`, width:`${width}px` };
  };

  const todayLeft = React.useMemo(() => {
    const today = new Date(); today.setHours(0,0,0,0);
    const px = (today - timelineStart) / 86400000 * dayW;
    return (px >= 0 && px <= timelineWidth) ? px : null;
  }, [weeks]);

  const heatmap = React.useMemo(() => resources.map(res => ({
    res,
    cols: weeks.map(ws => {
      const we = addDays(ws,6);
      return tasks.filter(t => t.resourceIds.includes(res.id) && parseDate(t.startDate)<=we && parseDate(t.endDate)>=ws);
    })
  })), [resources, tasks, weeks]);

  const assignColor = (projectName, current) => {
    if (current[projectName]) return current;
    const used = Object.values(current);
    const free = COLORS.find(c => !used.includes(c)) || COLORS[Object.keys(current).length % COLORS.length];
    return { ...current, [projectName]: free };
  };

  const addResource = () => {
    if (!newRes.trim()) return;
    const r = [...resources, { id: Date.now().toString(), name: newRes.trim() }];
    setResources(r); persist(tasks, r, pColors, milestones); setNewRes("");
  };
  const delResource = id => {
    const r = resources.filter(x => x.id!==id);
    const t = tasks
      .map(x => ({ ...x, resourceIds: x.resourceIds.filter(rid => rid!==id) }))
      .filter(x => x.resourceIds.length > 0);
    setResources(r); setTasks(t); persist(t, r, pColors, milestones);
  };
  const submitForm = () => {
    const { id, taskName, projectName, resourceIds, startDate, endDate, notes } = form;
    if (!taskName||!projectName||!resourceIds.length||!startDate||!endDate) return;
    const c = assignColor(projectName, pColors);
    const t = id
      ? tasks.map(x => x.id===id ? {...x,taskName,projectName,resourceIds,startDate,endDate,notes} : x)
      : [...tasks, { id:Date.now().toString(), taskName, projectName, resourceIds, startDate, endDate, notes }];
    setTasks(t); setPColors(c); persist(t, resources, c, milestones);
    setForm({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"" });
  };
  const delTask = id => { const t = tasks.filter(x => x.id!==id); setTasks(t); persist(t,resources,pColors,milestones); };
  const editTask = task => setForm({...task, notes: task.notes || "", resourceIds: task.resourceIds || []});

  const addMilestone = () => {
    if (!mForm.name.trim() || !mForm.date) return;
    const m = [...milestones, { id: Date.now().toString(), name: mForm.name.trim(), date: mForm.date, color: mForm.color }];
    setMilestones(m); persist(tasks, resources, pColors, m);
    setMForm({ name:"", date:"", color:"#F59E0B" });
  };
  const delMilestone = id => {
    const m = milestones.filter(x => x.id!==id);
    setMilestones(m); persist(tasks, resources, pColors, m);
  };

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({t:tasks,r:resources,c:pColors,m:milestones},null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "pm-workload-backup.json"; a.click();
  };
  const importJSON = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); setMilestones(d.m||[]);
        persist(d.t||[], d.r||[], d.c||{}, d.m||[]);
      } catch { alert("Invalid file"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  React.useLayoutEffect(() => {
    if (!mainRef.current) return;
    const update = () => {
      const w = mainRef.current.clientWidth;
      setMinVisibleWeeks(Math.max(8, Math.ceil((w - 148) / MIN_WEEK_W)));
    };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(mainRef.current);
    return () => ro.disconnect();
  }, []);

  React.useEffect(() => {
    if (filterResource && !resources.find(r => r.id === filterResource)) {
      setFilterResource("");
    }
  }, [resources]);

  React.useEffect(() => {
    if (filterProject && !tasks.some(t => t.projectName === filterProject)) {
      setFilterProject("");
    }
  }, [tasks]);

  const projects = [...new Set(tasks.map(t => t.projectName))];

  const S = {
    app:          { fontFamily:"'Segoe UI',system-ui,sans-serif", background:"var(--bg)", minHeight:"100vh", display:"flex", flexDirection:"column", color:"var(--text)" },
    header:       { background:"var(--surface)", borderBottom:"1px solid var(--border)", padding:"10px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:16, flexWrap:"wrap" },
    aside:        { width:256, background:"var(--surface)", borderRight:"1px solid var(--border)", padding:"14px 12px", overflowY:"auto", flexShrink:0, display:"flex", flexDirection:"column", gap:16 },
    main:         { flex:1, overflowY:"auto", overflowX:"hidden", padding:"16px 20px", minWidth:0 },
    label:        { fontSize:10, fontWeight:700, color:"var(--text-dimmer)", letterSpacing:"0.12em", marginBottom:6 },
    input:        { width:"100%", padding:"7px 9px", borderRadius:6, border:"1px solid var(--border)", background:"var(--input-bg)", color:"var(--text)", fontSize:12, outline:"none" },
    btn:          active => ({ padding:"5px 12px", borderRadius:6, border:"none", cursor:"pointer", fontSize:12, fontWeight:600, background:active?"#2563EB":"var(--btn-bg)", color:active?"#fff":"var(--btn-color)" }),
    card:         { background:"var(--card-bg)", borderRadius:6, padding:"8px 10px", marginBottom:6 },
    sectionTitle: { fontSize:11, fontWeight:700, color:"var(--text-dimmer)", letterSpacing:"0.1em", marginBottom:10 },
    sectionBox:   { background:"var(--surface)", borderRadius:10, border:"1px solid var(--border)", overflow:"clip" },
  };

  return (
    <div style={S.app}>
      <header style={S.header}>
        <div style={{display:"flex", alignItems:"baseline", gap:12}}>
          <span style={{fontWeight:800, fontSize:16, letterSpacing:"-0.5px", color:"var(--text-bright)"}}>PM Workload Board</span>
          <span style={{fontFamily:"monospace", fontSize:11, color:"var(--text-faint)"}}>{tasks.length} tasks · {resources.length} resources</span>
        </div>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
          {["gantt","heatmap","both"].map(v => (
            <button key={v} style={S.btn(view===v)} onClick={() => setView(v)}>
              {v==="both"?"Both":v.charAt(0).toUpperCase()+v.slice(1)}
            </button>
          ))}
          <div style={{width:1, height:18, background:"var(--border)", margin:"0 4px"}} />
          <button onClick={toggleTheme} title={theme==="dark"?"Switch to light theme":"Switch to dark theme"} style={S.btn(false)}>
            {theme==="dark" ? "☀" : "🌙"}
          </button>
          <div style={{width:1, height:18, background:"var(--border)", margin:"0 4px"}} />
          <button onClick={exportJSON} className="no-print" style={{...S.btn(false), color:"#34D399"}}>⬇ Export</button>
          <label className="no-print" style={{...S.btn(false), color:"#60A5FA", cursor:"pointer"}}>
            ⬆ Import<input type="file" accept=".json" onChange={importJSON} style={{display:"none"}} />
          </label>
          <button onClick={() => window.print()} className="no-print" style={{...S.btn(false), color:"#A78BFA"}}>🖨 Print</button>
          <button onClick={() => setSideOpen(o=>!o)} style={{...S.btn(false), display:"none"}} id="toggleSide">☰</button>
        </div>
      </header>

      <div id="pm-layout" style={{display:"flex", flex:1, overflow:"hidden"}}>
        {sideOpen && (
          <aside id="pm-sidebar" style={S.aside}>
            <div>
              <div style={S.label}>RESOURCES</div>
              {resources.map(r => (
                <div key={r.id} style={{...S.card, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
                  <span style={{fontSize:12}}>{r.name}</span>
                  <button onClick={() => delResource(r.id)} style={{background:"none", border:"none", color:"var(--text-dimmer)", cursor:"pointer", fontSize:15}}>×</button>
                </div>
              ))}
              <div style={{display:"flex", gap:4, marginTop:4}}>
                <input value={newRes} onChange={e=>setNewRes(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addResource()} placeholder="Add resource…" style={S.input} />
                <button onClick={addResource} style={{padding:"7px 11px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", cursor:"pointer", fontSize:16, fontWeight:700, flexShrink:0}}>+</button>
              </div>
            </div>

            {resources.length > 0 && (
              <div>
                <div style={S.label}>FILTER BY RESOURCE</div>
                <select
                  value={filterResource}
                  onChange={e => setFilterResource(e.target.value)}
                  style={{...S.input, color: filterResource ? "var(--text)" : "var(--text-dimmer)"}}
                >
                  <option value="">All resources</option>
                  {resources.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
            )}

            {projects.length > 0 && (
              <div>
                <div style={S.label}>FILTER BY PROJECT</div>
                <select
                  value={filterProject}
                  onChange={e => setFilterProject(e.target.value)}
                  style={{...S.input, color: filterProject ? "var(--text)" : "var(--text-dimmer)"}}
                >
                  <option value="">All projects</option>
                  {projects.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            )}

            {projects.length > 0 && (
              <div>
                <div style={S.label}>PROJECTS</div>
                {projects.map(p => (
                  <div key={p} style={{display:"flex", alignItems:"center", gap:7, marginBottom:4}}>
                    <div style={{width:10, height:10, borderRadius:2, background:pColors[p], flexShrink:0}} />
                    <span style={{fontSize:11, color:"var(--text-muted)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p}</span>
                  </div>
                ))}
              </div>
            )}

            <div>
              <div style={S.label}>MILESTONES</div>
              <input value={mForm.name} onChange={e=>setMForm({...mForm,name:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addMilestone()} placeholder="Milestone name" style={{...S.input, marginBottom:5}} />
              <input type="date" lang="en-GB" value={mForm.date} onChange={e=>setMForm({...mForm,date:e.target.value})} style={{...S.input, marginBottom:6, fontSize:11}} />
              <div style={{display:"flex", gap:6, marginBottom:6, alignItems:"center"}}>
                {MILESTONE_COLORS.map(col => (
                  <div key={col} onClick={() => setMForm({...mForm,color:col})} style={{width:18, height:18, borderRadius:"50%", background:col, cursor:"pointer", flexShrink:0, boxShadow:mForm.color===col?`0 0 0 2px var(--surface), 0 0 0 4px ${col}`:"none"}} />
                ))}
              </div>
              <button onClick={addMilestone} style={{width:"100%", padding:"6px", borderRadius:6, border:"none", background:"var(--btn-bg)", color:"var(--text)", fontSize:12, fontWeight:600, cursor:"pointer", marginBottom:6}}>+ Add Milestone</button>
              {milestones.map(m => (
                <div key={m.id} style={{display:"flex", alignItems:"center", gap:6, marginBottom:4}}>
                  <div style={{width:3, height:16, background:m.color, borderRadius:1, flexShrink:0}} />
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:11, color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{m.name}</div>
                    <div style={{fontSize:10, color:"var(--text-dimmer)"}}>{m.date}</div>
                  </div>
                  <button onClick={()=>delMilestone(m.id)} style={{background:"none", border:"none", color:"var(--text-dimmer)", cursor:"pointer", fontSize:14, flexShrink:0}}>×</button>
                </div>
              ))}
            </div>

            <div>
              <div style={S.label}>{form.id?"EDIT TASK":"NEW TASK"}</div>
              <input value={form.taskName} onChange={e=>setForm({...form,taskName:e.target.value})} placeholder="Task name" style={{...S.input, marginBottom:5}} />
              <input value={form.projectName} onChange={e=>setForm({...form,projectName:e.target.value})} placeholder="Project name" style={{...S.input, marginBottom:5}} list="projects-list" />
              <datalist id="projects-list">{projects.map(p=><option key={p} value={p}/>)}</datalist>
              <div style={{border:"1px solid var(--border)", borderRadius:6, background:"var(--input-bg)", marginBottom:5, padding:"5px 9px", maxHeight:96, overflowY:"auto"}}>
                {resources.length === 0
                  ? <span style={{fontSize:11, color:"var(--text-dimmer)"}}>Add resources first</span>
                  : resources.map(r => (
                      <label key={r.id} style={{display:"flex", alignItems:"center", gap:7, padding:"3px 0", cursor:"pointer"}}>
                        <input type="checkbox" checked={form.resourceIds.includes(r.id)}
                          onChange={e => {
                            const ids = e.target.checked ? [...form.resourceIds, r.id] : form.resourceIds.filter(x=>x!==r.id);
                            setForm({...form, resourceIds: ids});
                          }}
                          style={{accentColor:"#2563EB", cursor:"pointer"}} />
                        <span style={{fontSize:12, color:"var(--text)"}}>{r.name}</span>
                      </label>
                    ))
                }
              </div>
              <div style={{display:"flex", gap:4, marginBottom:5}}>
                <input type="date" lang="en-GB" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} style={{...S.input, flex:1, fontSize:11}} />
                <input type="date" lang="en-GB" value={form.endDate} onChange={e=>setForm({...form,endDate:e.target.value})} style={{...S.input, flex:1, fontSize:11}} />
              </div>
              <textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Notes (optional)" rows={2} style={{...S.input, marginBottom:8, resize:"vertical", fontFamily:"inherit", lineHeight:1.4}} />
              <button onClick={submitForm} style={{width:"100%", padding:"8px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", fontSize:13, fontWeight:600, cursor:"pointer"}}>
                {form.id?"Save changes":"Add"}
              </button>
              {form.id && (
                <button onClick={()=>setForm({id:null,taskName:"",projectName:"",resourceIds:[],startDate:"",endDate:"",notes:""})}
                  style={{width:"100%", padding:"6px", borderRadius:6, border:"1px solid var(--border)", background:"transparent", color:"var(--text-dim)", fontSize:12, cursor:"pointer", marginTop:4}}>
                  Cancel
                </button>
              )}
            </div>

            {tasks.length > 0 && (
              <div style={{flex:1, overflowY:"auto"}}>
                <div style={S.label}>TASKS ({tasks.length})</div>
                {tasks.map(t => {
                  const resNames = (t.resourceIds||[]).map(id=>resources.find(r=>r.id===id)?.name).filter(Boolean).join(", ");
                  const col = pColors[t.projectName]||"#3B82F6";
                  return (
                    <div key={t.id} style={{...S.card, borderLeft:`3px solid ${col}`, marginBottom:5}}>
                      <div style={{fontSize:12, fontWeight:600, color:"var(--text)", marginBottom:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.taskName}</div>
                      <div style={{fontSize:10, color:"var(--text-dim)"}}>{t.projectName}</div>
                      <div style={{fontSize:10, color:"var(--text-dimmer)"}}>{resNames} · {t.startDate} → {t.endDate}</div>
                      <div style={{display:"flex", gap:5, marginTop:6}}>
                        <button onClick={()=>editTask(t)} style={{flex:1, padding:"3px 0", borderRadius:4, border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)", fontSize:10, cursor:"pointer"}}>✏ Edit</button>
                        <button onClick={()=>delTask(t.id)} style={{flex:1, padding:"3px 0", borderRadius:4, border:"none", background:"rgba(127,29,29,0.5)", color:"#FCA5A5", fontSize:10, cursor:"pointer"}}>✕ Del</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </aside>
        )}

        <main ref={mainRef} style={S.main}>
          {tasks.length === 0 ? (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"80vh", color:"var(--text-faint)", gap:8}}>
              <div style={{fontSize:48}}>📊</div>
              <div style={{fontSize:15, fontWeight:700, color:"var(--text-dim)"}}>No tasks yet</div>
              <div style={{fontSize:12, color:"var(--text-faint)"}}>Add resources and tasks from the left panel</div>
            </div>
          ) : (
            <div style={{display:"flex", flexDirection:"column", gap:24}}>

              {(view==="gantt"||view==="both") && (
                <div>
                  <div style={S.sectionTitle}>GANTT — IMPLEMENTATION TIMELINE</div>
                  <div style={S.sectionBox}>

                    {/* Sticky week header */}
                    <div style={{display:"flex", borderBottom:"1px solid var(--border)", background:"var(--surface-2)", position:"sticky", top:0, zIndex:10}}>
                      <div style={{width:148, flexShrink:0, padding:"7px 10px", fontSize:10, color:"var(--text-faint)", borderRight:"1px solid var(--border)", position:"relative", zIndex:11, background:"var(--surface-2)"}}>Resource / Task</div>
                      <div style={{flex:1, overflow:"clip"}}>
                        <div ref={ganttHeaderRef} style={{display:"flex"}}>
                          {weeks.map((w,i) => (
                            <div key={i} style={{width:MIN_WEEK_W, flexShrink:0, padding:"7px 3px", fontSize:9, color:"var(--text-dimmer)", textAlign:"center", borderRight:i<weeks.length-1?"1px solid var(--border)":"", background:i%2===0?"var(--row-alt)":"transparent", fontWeight:600, letterSpacing:"0.02em"}}>
                              {fmtShort(w)}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Horizontally scrollable body */}
                    <div ref={ganttScrollRef} style={{overflowX:"auto"}} onScroll={handleGanttScroll}>
                      <div style={{minWidth:148 + timelineWidth, position:"relative"}}>
                        {milestones.map(m => {
                          const mLeft = (parseDate(m.date) - timelineStart) / 86400000 * dayW;
                          if (mLeft < 0 || mLeft > timelineWidth) return null;
                          return (
                            <div key={m.id} style={{position:"absolute", top:0, bottom:0, left:148 + mLeft, width:2, background:m.color, zIndex:4, pointerEvents:"none", opacity:0.9}}>
                              <div style={{position:"absolute", top:4, left:4, fontSize:9, color:m.color, fontWeight:700, whiteSpace:"nowrap", background:"var(--bg)", padding:"2px 5px", borderRadius:3, letterSpacing:"0.02em"}}>◆ {m.name}</div>
                            </div>
                          );
                        })}
                        {resources.filter(res => !filterResource || res.id === filterResource).map(res => {
                          const resTasks = tasks.filter(t=>t.resourceIds.includes(res.id) && (!filterProject || t.projectName===filterProject));
                          if (!resTasks.length) return null;
                          return (
                            <div key={res.id}>
                              <div style={{display:"flex", background:"var(--surface-3)", borderTop:"1px solid var(--border)"}}>
                                <div style={{width:148, flexShrink:0, padding:"3px 10px", fontSize:11, fontWeight:700, color:"var(--text-muted)", borderRight:"1px solid var(--border)", display:"flex", alignItems:"center", gap:6, position:"sticky", left:0, background:"var(--surface-3)", zIndex:3}}>
                                  {res.name}
                                  <span style={{background:resTasks.length>=3?"#7F1D1D":resTasks.length===2?"#78350F":"#1E3A5F", color:resTasks.length>=3?"#FCA5A5":resTasks.length===2?"#FDE68A":"#93C5FD", borderRadius:9, padding:"1px 6px", fontSize:9, fontWeight:700}}>
                                    {resTasks.length}
                                  </span>
                                </div>
                                <div style={{width:timelineWidth}} />
                              </div>
                              {resTasks.map(task => {
                                const col = pColors[task.projectName]||"#3B82F6";
                                return (
                                  <div key={task.id} style={{display:"flex", borderTop:"1px solid var(--border-subtle)", minHeight:40}}>
                                    <div style={{width:148, flexShrink:0, padding:"3px 10px", fontSize:10, color:"var(--text-dim)", borderRight:"1px solid var(--border)", display:"flex", alignItems:"center", gap:6, position:"sticky", left:0, background:"var(--bg)", zIndex:3}}>
                                      <div style={{width:7, height:7, borderRadius:2, background:col, flexShrink:0}} />
                                      <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{task.taskName}</span>
                                    </div>
                                    <div style={{width:timelineWidth, position:"relative", display:"flex", alignItems:"center"}}>
                                      {weeks.map((_,i) => i%2===0 && (
                                        <div key={i} style={{position:"absolute", top:0, bottom:0, left:i*MIN_WEEK_W, width:MIN_WEEK_W, background:"var(--row-alt)"}} />
                                      ))}
                                      {todayLeft!==null && (
                                        <div style={{position:"absolute", top:0, bottom:0, left:todayLeft, width:1, background:"rgba(239,68,68,0.5)", zIndex:2}} />
                                      )}
                                      <div
                                        onClick={()=>editTask(task)}
                                        title={(() => { const names = (task.resourceIds||[]).map(id=>resources.find(r=>r.id===id)?.name).filter(Boolean).join(", "); return `${task.taskName}\n${task.projectName}\n${task.startDate} → ${task.endDate}${names ? "\nResources: "+names : ""}${task.notes ? "\n\n"+task.notes : ""}`; })()}
                                        style={{
                                          position:"absolute", ...barStyle(task),
                                          height:24, borderRadius:5,
                                          background:col, opacity:0.92,
                                          display:"flex", alignItems:"center", padding:"0 8px",
                                          fontSize:10, color:"#fff", fontWeight:600,
                                          overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis",
                                          cursor:"pointer", zIndex:1,
                                          boxShadow:"0 0 0 1px rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.4)"
                                        }}
                                      >
                                        {task.taskName}
                                        {task.notes && (
                                          <div style={{position:"absolute", top:3, right:4, width:5, height:5, borderRadius:"50%", background:"#fff", opacity:0.6, flexShrink:0}} />
                                        )}
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                  </div>
                  {todayLeft!==null && <div style={{fontSize:10, color:"var(--text-dimmer)", marginTop:5}}>— Red line = today</div>}
                </div>
              )}

              {(view==="heatmap"||view==="both") && (
                <div>
                  <div style={S.sectionTitle}>HEATMAP — WEEKLY LOAD BY RESOURCE</div>
                  <div style={S.sectionBox}>

                    {/* Sticky week header */}
                    <div style={{display:"flex", borderBottom:"1px solid var(--border)", background:"var(--surface-2)", position:"sticky", top:0, zIndex:10}}>
                      <div style={{width:148, flexShrink:0, padding:"7px 10px", fontSize:10, color:"var(--text-faint)", borderRight:"1px solid var(--border)", position:"relative", zIndex:11, background:"var(--surface-2)"}}>Resource</div>
                      <div style={{flex:1, overflow:"clip"}}>
                        <div ref={heatHeaderRef} style={{display:"flex"}}>
                          {weeks.map((w,i) => (
                            <div key={i} style={{width:MIN_WEEK_W, flexShrink:0, padding:"7px 3px", fontSize:9, color:"var(--text-dimmer)", textAlign:"center", borderRight:i<weeks.length-1?"1px solid var(--border)":"", fontWeight:600}}>
                              {fmtShort(w)}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Horizontally scrollable body */}
                    <div ref={heatScrollRef} style={{overflowX:"auto"}} onScroll={handleHeatScroll}>
                      <div style={{minWidth:148 + timelineWidth}}>
                        {heatmap.filter(h=>tasks.some(t=>t.resourceIds.includes(h.res.id))).filter(h => !filterResource || h.res.id === filterResource).map(({res,cols}) => (
                          <div key={res.id} style={{display:"flex", borderTop:"1px solid var(--border)"}}>
                            <div style={{width:148, flexShrink:0, padding:"10px", fontSize:12, fontWeight:600, color:"var(--text-heatmap-res)", borderRight:"1px solid var(--border)", display:"flex", alignItems:"center", position:"sticky", left:0, background:"var(--surface)", zIndex:1}}>{res.name}</div>
                            {cols.map((cellTasks,i) => {
                              const totalN = cellTasks.length;
                              const projectTasks = filterProject ? cellTasks.filter(t=>t.projectName===filterProject) : cellTasks;
                              const projectN = projectTasks.length;
                              const tooltipText = () => {
                                if (totalN === 0) return "";
                                if (filterProject) {
                                  const header = `${filterProject}: ${projectN} of ${totalN} task(s) this week`;
                                  const projLines = projectTasks.length ? "\n" + projectTasks.map(t=>`• ${t.taskName}`).join("\n") : "";
                                  const others = cellTasks.filter(t=>t.projectName!==filterProject);
                                  const otherLines = others.length ? "\nOther projects:\n" + others.map(t=>`• ${t.taskName} (${t.projectName})`).join("\n") : "";
                                  return header + projLines + otherLines;
                                }
                                return cellTasks.map(t=>`${t.taskName} (${t.projectName})`).join("\n");
                              };
                              return (
                                <div key={i}
                                  title={tooltipText()}
                                  style={{width:MIN_WEEK_W, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", background:heatBg(totalN), borderRight:i<weeks.length-1?"1px solid var(--border-subtle)":"", minHeight:34, cursor:totalN>0?"pointer":"default"}}
                                >
                                  {totalN>0 && (
                                    <span style={{fontSize:11, fontWeight:800, color:heatFg(totalN), letterSpacing:"-0.5px"}}>
                                      {filterProject ? `${projectN}/${totalN}` : totalN}
                                    </span>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                  <div style={{display:"flex", gap:10, marginTop:8, alignItems:"center", flexWrap:"wrap"}}>
                    <span style={{fontSize:10, color:"var(--text-dimmer)"}}>Parallel tasks:</span>
                    {[0,1,2,3,4].map(n => (
                      <div key={n} style={{display:"flex", alignItems:"center", gap:4}}>
                        <div style={{width:18, height:18, borderRadius:3, background:heatBg(n), border:"1px solid var(--border)"}} />
                        <span style={{fontSize:10, color:"var(--text-dim)"}}>{n===4?"4+":n}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
