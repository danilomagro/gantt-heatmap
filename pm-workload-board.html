<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PM Workload Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0F1E; color: #E2E8F0; font-family: 'Segoe UI', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0A0F1E; }
  ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 3px; }
  input, select { color-scheme: dark; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const COLORS = ["#E84855","#3A86FF","#06D6A0","#FFB703","#8338EC","#FF6B35","#4ECDC4","#A78BFA","#F472B6","#34D399"];
const STORAGE_KEY = "pm-gantt-v2";

function parseDate(s) { return new Date(s + "T00:00:00"); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfMonday(d) {
  const r = new Date(d); const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff); r.setHours(0,0,0,0); return r;
}
function fmtShort(d) { return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" }); }
const heatBg = n => ["#1E293B","#1E3A5F","#7C3D12","#7F1D1D","#4C0519"][Math.min(n,4)];
const heatFg = n => n===0?"#334155": n===1?"#93C5FD": n===2?"#FDE68A":"#FCA5A5";

// localStorage-based storage (replaces window.storage from Claude artifacts)
const storage = {
  get: (key) => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
  set: (key, val) => { try { localStorage.setItem(key, val); } catch {} },
};

function normalizeTasks(rawTasks) {
  return (rawTasks || []).map(({ resourceId, ...t }) => ({
    ...t,
    resourceIds: t.resourceIds || (resourceId ? [resourceId] : []),
  }));
}

function App() {
  const [tasks, setTasks] = React.useState([]);
  const [resources, setResources] = React.useState([]);
  const [pColors, setPColors] = React.useState({});
  const [view, setView] = React.useState("both");
  const [form, setForm] = React.useState({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"" });
  const [newRes, setNewRes] = React.useState("");
  const [sideOpen, setSideOpen] = React.useState(true);
  const [filterResource, setFilterResource] = React.useState("");
  const [filterProject, setFilterProject] = React.useState("");

  React.useEffect(() => {
    const r = storage.get(STORAGE_KEY);
    if (r) { try { const d = JSON.parse(r.value); setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); } catch {} }
  }, []);

  const persist = (t, r, c) => storage.set(STORAGE_KEY, JSON.stringify({ t, r, c }));

  const weeks = React.useMemo(() => {
    const ws = [];
    if (!tasks.length) {
      let cur = startOfMonday(new Date());
      for (let i=0; i<8; i++) { ws.push(new Date(cur)); cur = addDays(cur,7); }
      return ws;
    }
    const dates = tasks.flatMap(t => [parseDate(t.startDate), parseDate(t.endDate)]);
    let cur = startOfMonday(new Date(Math.min(...dates)));
    const end = new Date(Math.max(...dates));
    while (cur <= end) { ws.push(new Date(cur)); cur = addDays(cur,7); }
    while (ws.length < 8) ws.push(addDays(ws[ws.length-1],7));
    return ws;
  }, [tasks]);

  const totalDays = weeks.length * 7;
  const timelineStart = weeks[0];

  const barStyle = task => {
    const s = parseDate(task.startDate);
    const e = addDays(parseDate(task.endDate), 1);
    const left = Math.max(0, (s - timelineStart) / 86400000 / totalDays * 100);
    const right = Math.min(100, (e - timelineStart) / 86400000 / totalDays * 100);
    return { left:`${left}%`, width:`${Math.max(0.8, right-left)}%` };
  };

  const todayLeft = React.useMemo(() => {
    const today = new Date(); today.setHours(0,0,0,0);
    const pct = (today - timelineStart) / 86400000 / totalDays * 100;
    return pct >= 0 && pct <= 100 ? pct : null;
  }, [weeks]);

  const heatmap = React.useMemo(() => resources.map(res => ({
    res,
    cols: weeks.map(ws => {
      const we = addDays(ws,6);
      return tasks.filter(t => t.resourceIds.includes(res.id) && parseDate(t.startDate)<=we && parseDate(t.endDate)>=ws);
    })
  })), [resources, tasks, weeks]);

  const assignColor = (projectName, current) => {
    if (current[projectName]) return current;
    const used = Object.values(current);
    const free = COLORS.find(c => !used.includes(c)) || COLORS[Object.keys(current).length % COLORS.length];
    return { ...current, [projectName]: free };
  };

  const addResource = () => {
    if (!newRes.trim()) return;
    const r = [...resources, { id: Date.now().toString(), name: newRes.trim() }];
    setResources(r); persist(tasks, r, pColors); setNewRes("");
  };
  const delResource = id => {
    const r = resources.filter(x => x.id!==id);
    const t = tasks
      .map(x => ({ ...x, resourceIds: x.resourceIds.filter(rid => rid!==id) }))
      .filter(x => x.resourceIds.length > 0);
    setResources(r); setTasks(t); persist(t, r, pColors);
  };
  const submitForm = () => {
    const { id, taskName, projectName, resourceIds, startDate, endDate, notes } = form;
    if (!taskName||!projectName||!resourceIds.length||!startDate||!endDate) return;
    const c = assignColor(projectName, pColors);
    const t = id
      ? tasks.map(x => x.id===id ? {...x,taskName,projectName,resourceIds,startDate,endDate,notes} : x)
      : [...tasks, { id:Date.now().toString(), taskName, projectName, resourceIds, startDate, endDate, notes }];
    setTasks(t); setPColors(c); persist(t, resources, c);
    setForm({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"" });
  };
  const delTask = id => { const t = tasks.filter(x => x.id!==id); setTasks(t); persist(t,resources,pColors); };
  const editTask = task => setForm({...task, notes: task.notes || "", resourceIds: task.resourceIds || []});

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({t:tasks,r:resources,c:pColors},null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "pm-workload-backup.json"; a.click();
  };
  const importJSON = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{});
        persist(d.t||[], d.r||[], d.c||{});
      } catch { alert("Invalid file"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  React.useEffect(() => {
    if (filterResource && !resources.find(r => r.id === filterResource)) {
      setFilterResource("");
    }
  }, [resources]);

  React.useEffect(() => {
    if (filterProject && !tasks.some(t => t.projectName === filterProject)) {
      setFilterProject("");
    }
  }, [tasks]);

  const projects = [...new Set(tasks.map(t => t.projectName))];

  const S = {
    app: { fontFamily:"'Segoe UI',system-ui,sans-serif", background:"#0A0F1E", minHeight:"100vh", display:"flex", flexDirection:"column", color:"#E2E8F0" },
    header: { background:"#111827", borderBottom:"1px solid #1F2937", padding:"10px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:16, flexWrap:"wrap" },
    aside: { width:256, background:"#111827", borderRight:"1px solid #1F2937", padding:"14px 12px", overflowY:"auto", flexShrink:0, display:"flex", flexDirection:"column", gap:16 },
    main: { flex:1, overflowY:"auto", overflowX:"auto", padding:"16px 20px", minWidth:0 },
    label: { fontSize:10, fontWeight:700, color:"#4B5563", letterSpacing:"0.12em", marginBottom:6 },
    input: { width:"100%", padding:"7px 9px", borderRadius:6, border:"1px solid #1F2937", background:"#0A0F1E", color:"#E2E8F0", fontSize:12, outline:"none" },
    btn: active => ({ padding:"5px 12px", borderRadius:6, border:"none", cursor:"pointer", fontSize:12, fontWeight:600, background:active?"#2563EB":"#1F2937", color:active?"#fff":"#6B7280" }),
    card: { background:"#0A0F1E", borderRadius:6, padding:"8px 10px", marginBottom:6 },
    sectionTitle: { fontSize:11, fontWeight:700, color:"#4B5563", letterSpacing:"0.1em", marginBottom:10 },
    sectionBox: { background:"#111827", borderRadius:10, border:"1px solid #1F2937", overflow:"hidden" },
  };

  return (
    <div style={S.app}>
      <header style={S.header}>
        <div style={{display:"flex", alignItems:"baseline", gap:12}}>
          <span style={{fontWeight:800, fontSize:16, letterSpacing:"-0.5px", color:"#F9FAFB"}}>PM Workload Board</span>
          <span style={{fontFamily:"monospace", fontSize:11, color:"#374151"}}>{tasks.length} tasks · {resources.length} resources</span>
        </div>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
          {["gantt","heatmap","both"].map(v => (
            <button key={v} style={S.btn(view===v)} onClick={() => setView(v)}>
              {v==="both"?"Both":v.charAt(0).toUpperCase()+v.slice(1)}
            </button>
          ))}
          <div style={{width:1, height:18, background:"#1F2937", margin:"0 4px"}} />
          <button onClick={exportJSON} style={{...S.btn(false), color:"#34D399"}}>⬇ Export</button>
          <label style={{...S.btn(false), color:"#60A5FA", cursor:"pointer"}}>
            ⬆ Import<input type="file" accept=".json" onChange={importJSON} style={{display:"none"}} />
          </label>
          <button onClick={() => setSideOpen(o=>!o)} style={{...S.btn(false), display:"none"}} id="toggleSide">☰</button>
        </div>
      </header>

      <div style={{display:"flex", flex:1, overflow:"hidden"}}>
        {sideOpen && (
          <aside style={S.aside}>
            <div>
              <div style={S.label}>RESOURCES</div>
              {resources.map(r => (
                <div key={r.id} style={{...S.card, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
                  <span style={{fontSize:12}}>{r.name}</span>
                  <button onClick={() => delResource(r.id)} style={{background:"none", border:"none", color:"#4B5563", cursor:"pointer", fontSize:15}}>×</button>
                </div>
              ))}
              <div style={{display:"flex", gap:4, marginTop:4}}>
                <input value={newRes} onChange={e=>setNewRes(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addResource()} placeholder="Add resource…" style={S.input} />
                <button onClick={addResource} style={{padding:"7px 11px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", cursor:"pointer", fontSize:16, fontWeight:700, flexShrink:0}}>+</button>
              </div>
            </div>

            {resources.length > 0 && (
              <div>
                <div style={S.label}>FILTER BY RESOURCE</div>
                <select
                  value={filterResource}
                  onChange={e => setFilterResource(e.target.value)}
                  style={{...S.input, color: filterResource ? "#E2E8F0" : "#4B5563"}}
                >
                  <option value="">All resources</option>
                  {resources.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
            )}

            {projects.length > 0 && (
              <div>
                <div style={S.label}>FILTER BY PROJECT</div>
                <select
                  value={filterProject}
                  onChange={e => setFilterProject(e.target.value)}
                  style={{...S.input, color: filterProject ? "#E2E8F0" : "#4B5563"}}
                >
                  <option value="">All projects</option>
                  {projects.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            )}

            {projects.length > 0 && (
              <div>
                <div style={S.label}>PROJECTS</div>
                {projects.map(p => (
                  <div key={p} style={{display:"flex", alignItems:"center", gap:7, marginBottom:4}}>
                    <div style={{width:10, height:10, borderRadius:2, background:pColors[p], flexShrink:0}} />
                    <span style={{fontSize:11, color:"#9CA3AF", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p}</span>
                  </div>
                ))}
              </div>
            )}

            <div>
              <div style={S.label}>{form.id?"EDIT TASK":"NEW TASK"}</div>
              <input value={form.taskName} onChange={e=>setForm({...form,taskName:e.target.value})} placeholder="Task name" style={{...S.input, marginBottom:5}} />
              <input value={form.projectName} onChange={e=>setForm({...form,projectName:e.target.value})} placeholder="Project name" style={{...S.input, marginBottom:5}} list="projects-list" />
              <datalist id="projects-list">{projects.map(p=><option key={p} value={p}/>)}</datalist>
              <div style={{border:"1px solid #1F2937", borderRadius:6, background:"#0A0F1E", marginBottom:5, padding:"5px 9px", maxHeight:96, overflowY:"auto"}}>
                {resources.length === 0
                  ? <span style={{fontSize:11, color:"#4B5563"}}>Add resources first</span>
                  : resources.map(r => (
                      <label key={r.id} style={{display:"flex", alignItems:"center", gap:7, padding:"3px 0", cursor:"pointer"}}>
                        <input type="checkbox" checked={form.resourceIds.includes(r.id)}
                          onChange={e => {
                            const ids = e.target.checked ? [...form.resourceIds, r.id] : form.resourceIds.filter(x=>x!==r.id);
                            setForm({...form, resourceIds: ids});
                          }}
                          style={{accentColor:"#2563EB", cursor:"pointer"}} />
                        <span style={{fontSize:12, color:"#E2E8F0"}}>{r.name}</span>
                      </label>
                    ))
                }
              </div>
              <div style={{display:"flex", gap:4, marginBottom:5}}>
                <input type="date" lang="en-GB" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} style={{...S.input, flex:1, fontSize:11}} />
                <input type="date" lang="en-GB" value={form.endDate} onChange={e=>setForm({...form,endDate:e.target.value})} style={{...S.input, flex:1, fontSize:11}} />
              </div>
              <textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Notes (optional)" rows={2} style={{...S.input, marginBottom:8, resize:"vertical", fontFamily:"inherit", lineHeight:1.4}} />
              <button onClick={submitForm} style={{width:"100%", padding:"8px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", fontSize:13, fontWeight:600, cursor:"pointer"}}>
                {form.id?"Save changes":"Add"}
              </button>
              {form.id && (
                <button onClick={()=>setForm({id:null,taskName:"",projectName:"",resourceIds:[],startDate:"",endDate:"",notes:""})}
                  style={{width:"100%", padding:"6px", borderRadius:6, border:"1px solid #1F2937", background:"transparent", color:"#6B7280", fontSize:12, cursor:"pointer", marginTop:4}}>
                  Cancel
                </button>
              )}
            </div>

            {tasks.length > 0 && (
              <div style={{flex:1, overflowY:"auto"}}>
                <div style={S.label}>TASKS ({tasks.length})</div>
                {tasks.map(t => {
                  const resNames = (t.resourceIds||[]).map(id=>resources.find(r=>r.id===id)?.name).filter(Boolean).join(", ");
                  const col = pColors[t.projectName]||"#3B82F6";
                  return (
                    <div key={t.id} style={{...S.card, borderLeft:`3px solid ${col}`, marginBottom:5}}>
                      <div style={{fontSize:12, fontWeight:600, color:"#E2E8F0", marginBottom:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.taskName}</div>
                      <div style={{fontSize:10, color:"#6B7280"}}>{t.projectName}</div>
                      <div style={{fontSize:10, color:"#4B5563"}}>{resNames} · {t.startDate} → {t.endDate}</div>
                      <div style={{display:"flex", gap:5, marginTop:6}}>
                        <button onClick={()=>editTask(t)} style={{flex:1, padding:"3px 0", borderRadius:4, border:"1px solid #1F2937", background:"transparent", color:"#9CA3AF", fontSize:10, cursor:"pointer"}}>✏ Edit</button>
                        <button onClick={()=>delTask(t.id)} style={{flex:1, padding:"3px 0", borderRadius:4, border:"none", background:"rgba(127,29,29,0.5)", color:"#FCA5A5", fontSize:10, cursor:"pointer"}}>✕ Del</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </aside>
        )}

        <main style={S.main}>
          {tasks.length === 0 ? (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"80vh", color:"#374151", gap:8}}>
              <div style={{fontSize:48}}>📊</div>
              <div style={{fontSize:15, fontWeight:700, color:"#6B7280"}}>No tasks yet</div>
              <div style={{fontSize:12, color:"#374151"}}>Add resources and tasks from the left panel</div>
            </div>
          ) : (
            <div style={{display:"flex", flexDirection:"column", gap:24}}>

              {(view==="gantt"||view==="both") && (
                <div>
                  <div style={S.sectionTitle}>GANTT — IMPLEMENTATION TIMELINE</div>
                  <div style={S.sectionBox}>
                    <div style={{display:"flex", borderBottom:"1px solid #1F2937", background:"#0F172A"}}>
                      <div style={{width:148, flexShrink:0, padding:"7px 10px", fontSize:10, color:"#374151", borderRight:"1px solid #1F2937"}}>Resource / Task</div>
                      <div style={{flex:1, display:"flex"}}>
                        {weeks.map((w,i) => (
                          <div key={i} style={{flex:1, padding:"7px 3px", fontSize:9, color:"#4B5563", textAlign:"center", borderRight:i<weeks.length-1?"1px solid #1F2937":"", background:i%2===0?"rgba(255,255,255,0.01)":"transparent", fontWeight:600, letterSpacing:"0.02em"}}>
                            {fmtShort(w)}
                          </div>
                        ))}
                      </div>
                    </div>

                    {resources.filter(res => !filterResource || res.id === filterResource).map(res => {
                      const resTasks = tasks.filter(t=>t.resourceIds.includes(res.id) && (!filterProject || t.projectName===filterProject));
                      if (!resTasks.length) return null;
                      return (
                        <div key={res.id}>
                          <div style={{display:"flex", background:"#0D1524", borderTop:"1px solid #1F2937"}}>
                            <div style={{width:148, flexShrink:0, padding:"5px 10px", fontSize:11, fontWeight:700, color:"#9CA3AF", borderRight:"1px solid #1F2937", display:"flex", alignItems:"center", gap:6}}>
                              {res.name}
                              <span style={{background:resTasks.length>=3?"#7F1D1D":resTasks.length===2?"#78350F":"#1E3A5F", color:resTasks.length>=3?"#FCA5A5":resTasks.length===2?"#FDE68A":"#93C5FD", borderRadius:9, padding:"1px 6px", fontSize:9, fontWeight:700}}>
                                {resTasks.length}
                              </span>
                            </div>
                            <div style={{flex:1}} />
                          </div>
                          {resTasks.map(task => {
                            const col = pColors[task.projectName]||"#3B82F6";
                            return (
                              <div key={task.id} style={{display:"flex", borderTop:"1px solid rgba(255,255,255,0.03)", minHeight:34}}>
                                <div style={{width:148, flexShrink:0, padding:"5px 10px", fontSize:10, color:"#6B7280", borderRight:"1px solid #1F2937", display:"flex", alignItems:"center", gap:6}}>
                                  <div style={{width:7, height:7, borderRadius:2, background:col, flexShrink:0}} />
                                  <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{task.taskName}</span>
                                </div>
                                <div style={{flex:1, position:"relative", display:"flex", alignItems:"center"}}>
                                  {weeks.map((_,i) => i%2===0 && (
                                    <div key={i} style={{position:"absolute", top:0, bottom:0, left:`${i/weeks.length*100}%`, width:`${1/weeks.length*100}%`, background:"rgba(255,255,255,0.01)"}} />
                                  ))}
                                  {todayLeft!==null && (
                                    <div style={{position:"absolute", top:0, bottom:0, left:`${todayLeft}%`, width:1, background:"rgba(239,68,68,0.5)", zIndex:2}} />
                                  )}
                                  <div
                                    onClick={()=>editTask(task)}
                                    title={(() => { const names = (task.resourceIds||[]).map(id=>resources.find(r=>r.id===id)?.name).filter(Boolean).join(", "); return `${task.taskName}\n${task.projectName}\n${task.startDate} → ${task.endDate}${names ? "\nResources: "+names : ""}${task.notes ? "\n\n"+task.notes : ""}`; })()}
                                    style={{
                                      position:"absolute", ...barStyle(task),
                                      height:22, borderRadius:5,
                                      background:col, opacity:0.92,
                                      display:"flex", alignItems:"center", padding:"0 8px",
                                      fontSize:10, color:"#fff", fontWeight:600,
                                      overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis",
                                      cursor:"pointer", zIndex:1,
                                      boxShadow:"0 0 0 1px rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.4)"
                                    }}
                                  >
                                    {task.taskName}
                                    {task.notes && (
                                      <div style={{position:"absolute", top:3, right:4, width:5, height:5, borderRadius:"50%", background:"#fff", opacity:0.6, flexShrink:0}} />
                                    )}
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                  {todayLeft!==null && <div style={{fontSize:10, color:"#4B5563", marginTop:5}}>— Red line = today</div>}
                </div>
              )}

              {(view==="heatmap"||view==="both") && (
                <div>
                  <div style={S.sectionTitle}>HEATMAP — WEEKLY LOAD BY RESOURCE</div>
                  <div style={S.sectionBox}>
                    <div style={{display:"flex", borderBottom:"1px solid #1F2937", background:"#0F172A"}}>
                      <div style={{width:148, flexShrink:0, padding:"7px 10px", fontSize:10, color:"#374151", borderRight:"1px solid #1F2937"}}>Resource</div>
                      {weeks.map((w,i) => (
                        <div key={i} style={{flex:1, padding:"7px 3px", fontSize:9, color:"#4B5563", textAlign:"center", borderRight:i<weeks.length-1?"1px solid #1F2937":"", fontWeight:600}}>{fmtShort(w)}</div>
                      ))}
                    </div>
                    {heatmap.filter(h=>tasks.some(t=>t.resourceIds.includes(h.res.id))).filter(h => !filterResource || h.res.id === filterResource).map(({res,cols}) => (
                      <div key={res.id} style={{display:"flex", borderTop:"1px solid #1F2937"}}>
                        <div style={{width:148, flexShrink:0, padding:"10px", fontSize:12, fontWeight:600, color:"#D1D5DB", borderRight:"1px solid #1F2937", display:"flex", alignItems:"center"}}>{res.name}</div>
                        {cols.map((cellTasks,i) => {
                          const totalN = cellTasks.length;
                          const projectTasks = filterProject ? cellTasks.filter(t=>t.projectName===filterProject) : cellTasks;
                          const projectN = projectTasks.length;
                          const tooltipText = () => {
                            if (totalN === 0) return "";
                            if (filterProject) {
                              const header = `${filterProject}: ${projectN} of ${totalN} task(s) this week`;
                              const projLines = projectTasks.length ? "\n" + projectTasks.map(t=>`• ${t.taskName}`).join("\n") : "";
                              const others = cellTasks.filter(t=>t.projectName!==filterProject);
                              const otherLines = others.length ? "\nOther projects:\n" + others.map(t=>`• ${t.taskName} (${t.projectName})`).join("\n") : "";
                              return header + projLines + otherLines;
                            }
                            return cellTasks.map(t=>`${t.taskName} (${t.projectName})`).join("\n");
                          };
                          return (
                            <div key={i}
                              title={tooltipText()}
                              style={{flex:1, display:"flex", alignItems:"center", justifyContent:"center", background:heatBg(totalN), borderRight:i<weeks.length-1?"1px solid rgba(255,255,255,0.04)":"", minHeight:42, cursor:totalN>0?"pointer":"default"}}
                            >
                              {totalN>0 && (
                                <span style={{fontSize:filterProject?11:15, fontWeight:800, color:heatFg(totalN), letterSpacing:filterProject?"-0.5px":"normal"}}>
                                  {filterProject ? `${projectN}/${totalN}` : totalN}
                                </span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                  <div style={{display:"flex", gap:10, marginTop:8, alignItems:"center", flexWrap:"wrap"}}>
                    <span style={{fontSize:10, color:"#4B5563"}}>Parallel tasks:</span>
                    {[0,1,2,3,4].map(n => (
                      <div key={n} style={{display:"flex", alignItems:"center", gap:4}}>
                        <div style={{width:18, height:18, borderRadius:3, background:heatBg(n), border:"1px solid #1F2937"}} />
                        <span style={{fontSize:10, color:"#6B7280"}}>{n===4?"4+":n}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
