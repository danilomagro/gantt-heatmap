    if (endDate < startDate) { alert("End date must be on or after start date."); return; }
    const pct = completion === "" ? null : Math.min(100, Math.max(0, parseInt(completion)||0));
    const c = assignColor(projectName, pColors);
    const t = id
      ? tasks.map(x => x.id===id ? {...x,taskName,projectName,resourceIds,startDate,endDate,notes,completion:pct,allocation,tentative:!!form.tentative} : x)
      : [...tasks, { id:Date.now().toString(), taskName, projectName, resourceIds, startDate, endDate, notes, completion:pct, allocation, tentative:!!form.tentative }];
    setTasks(t); setPColors(c); persist(t, resources, c, milestones);
    setForm({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"", completion:"", allocation:100, allocTouched:false, tentative:false });
  };

  const confirmTask = id => {
    const t = tasks.map(x => x.id === id ? {...x, tentative:false} : x);
    setTasks(t); persist(t, resources, pColors, milestones);
  };

  const delTask = id => {
    saveUndo("Deleted task", tasks, resources, pColors, milestones);
    const t = tasks.filter(x => x.id!==id);
    setTasks(t); persist(t,resources,pColors,milestones);
  };

  const cancelForm = () => setForm({ id:null, taskName:"", projectName:"", resourceIds:[], startDate:"", endDate:"", notes:"", completion:"", allocation:100, allocTouched:false, tentative:false });
  const editTask = task => setForm({...task, notes: task.notes || "", resourceIds: task.resourceIds || [], completion: task.completion ?? "", allocation: allocOf(task), allocTouched: true, tentative: !!task.tentative});

  // New tasks inherit the effort of the latest task in the same project (e.g. Help Desk → 20 %)
  const projectAlloc = name => {
    const last = tasks.filter(t => t.projectName === name).sort((a, b) => b.startDate.localeCompare(a.startDate))[0];
    return last ? allocOf(last) : 100;
  };

  const openEditModal = task => setEditModal({...task, notes: task.notes||"", resourceIds: task.resourceIds||[], completion: task.completion??"", allocation: allocOf(task)});

  const submitModal = () => {
    if (!editModal) return;
    const { id, taskName, projectName, resourceIds, startDate, endDate, notes, completion } = editModal;
    if (!taskName||!projectName||!resourceIds.length||!startDate||!endDate) return;
    if (endDate < startDate) { alert("End date must be on or after start date."); return; }
    const pct = completion === "" ? null : Math.min(100, Math.max(0, parseInt(completion)||0));
    const c = assignColor(projectName, pColors);
    const allocation = clampAlloc(editModal.allocation);
    const t = tasks.map(x => x.id===id ? {...x,taskName,projectName,resourceIds,startDate,endDate,notes,completion:pct,allocation,tentative:!!editModal.tentative} : x);
    setTasks(t); setPColors(c); persist(t, resources, c, milestones);
    setEditModal(null);
  };

  const delTaskFromModal = id => {
    setEditModal(null);
    saveUndo("Deleted task", tasks, resources, pColors, milestones);
    const t = tasks.filter(x => x.id!==id);
    setTasks(t); persist(t, resources, pColors, milestones);
  };

  const loadSampleData = () => {
    if (tasks.length > 0 && !window.confirm("This will replace your current data. Continue?")) return;
    setTasks(normalizeTasks(SAMPLE_DATA.t));
    setResources(SAMPLE_DATA.r);
    setPColors(SAMPLE_DATA.c);
    setMilestones(SAMPLE_DATA.m);
    setTimeOff(SAMPLE_DATA.o);
    persist(SAMPLE_DATA.t, SAMPLE_DATA.r, SAMPLE_DATA.c, SAMPLE_DATA.m, SAMPLE_DATA.o);
  };

  // ── keyboard shortcuts ────────────────────────────────────────────────────
  React.useEffect(() => {
    const handler = e => {
      if (e.key === "Escape") { setEditModal(null); cancelForm(); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  // ── drag & drop ───────────────────────────────────────────────────────────
  React.useEffect(() => {
    const onMove = e => {
      if (!dragRef.current) return;
      const { startX, el, mode, days, origLeft, origWidth } = dragRef.current;
      const dw = dayWRef.current;
      let deltaDays = Math.round((e.clientX - startX) / dw);
      // resizing never shrinks a task below one day
      if (mode === "start") deltaDays = Math.min(deltaDays, days - 1);
      if (mode === "end")   deltaDays = Math.max(deltaDays, 1 - days);
      dragRef.current.deltaDays = deltaDays;
      if (!el) return;
      if (mode === "move") el.style.transform = `translateX(${deltaDays * dw}px)`;
      if (mode === "start") { el.style.left = `${origLeft + deltaDays * dw}px`; el.style.width = `${origWidth - deltaDays * dw}px`; }
      if (mode === "end")   el.style.width = `${origWidth + deltaDays * dw}px`;
    };
    const onUp = () => {
      if (!dragRef.current) return;
      const { taskId, mode, origStart, origEnd, origLeft, origWidth, deltaDays, el, snap } = dragRef.current;
      if (el) { el.style.transform = ""; el.style.opacity = ""; el.style.left = `${origLeft}px`; el.style.width = `${origWidth}px`; }
      lastDragMovedRef.current = deltaDays !== 0;
      if (deltaDays !== 0) {
        const newStart = mode === "end"   ? origStart : fmtDate(addDays(parseDate(origStart), deltaDays));
        const newEnd   = mode === "start" ? origEnd   : fmtDate(addDays(parseDate(origEnd),   deltaDays));
        setTasks(prev => {
          const t = prev.map(x => x.id === taskId ? {...x, startDate: newStart, endDate: newEnd} : x);
          persist(t, snap.resources, snap.pColors, snap.milestones);
          return t;
        });
      }
      dragRef.current = null;
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, []);

  // ── milestones ────────────────────────────────────────────────────────────
  const addMilestone = () => {
    if (!mForm.name.trim() || !mForm.date) return;
    const m = [...milestones, { id: Date.now().toString(), name: mForm.name.trim(), date: mForm.date, color: mForm.color }];
    setMilestones(m); persist(tasks, resources, pColors, m);
    setMForm({ name:"", date:"", color:"#F59E0B" });
  };

  const delMilestone = id => {
    saveUndo("Deleted milestone", tasks, resources, pColors, milestones);
    const m = milestones.filter(x => x.id!==id);
    setMilestones(m); persist(tasks, resources, pColors, m);
  };

  // ── time off ──────────────────────────────────────────────────────────────
  const addTimeOff = () => {
    const resourceId = oForm.resourceId || resources[0]?.id;
    if (!resourceId || !oForm.startDate) return;
    const endDate = oForm.endDate && oForm.endDate >= oForm.startDate ? oForm.endDate : oForm.startDate;
    const o = [...timeOff, { id: Date.now().toString(), resourceId, startDate: oForm.startDate, endDate, label: oForm.label.trim() }];
    setTimeOff(o); persist(tasks, resources, pColors, milestones, o);
    setOForm(f => ({ ...f, startDate:"", endDate:"", label:"" }));
  };

  const delTimeOff = id => {
    saveUndo("Deleted time off", tasks, resources, pColors, milestones, timeOff);
    const o = timeOff.filter(x => x.id !== id);
    setTimeOff(o); persist(tasks, resources, pColors, milestones, o);
  };

  // ── import / export ───────────────────────────────────────────────────────
  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({t:tasks,r:resources,c:pColors,m:milestones,o:timeOff},null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "pm-workload-backup.json"; a.click();
  };

  const importJSON = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!Array.isArray(d.t) || !Array.isArray(d.r)) { alert("Invalid file format."); return; }
        setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); setMilestones(d.m||[]); setTimeOff(d.o||[]);
        persist(d.t||[], d.r||[], d.c||{}, d.m||[], d.o||[]);
      } catch { alert("Invalid file"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // ── share via URL ─────────────────────────────────────────────────────────
  const shareBoard = () => {
    const encoded = encodeBoard(tasks, resources, pColors, milestones, timeOff);
    if (!encoded) return;
    const url = location.href.split("#")[0] + "#board=" + encoded;
    navigator.clipboard.writeText(url)
      .then(() => { setCopyToast(true); setTimeout(() => setCopyToast(false), 2500); })
      .catch(() => window.prompt("Copy this link:", url));
  };

  const importSharedBoard = () => {
    if (!window.confirm("This will overwrite your saved board with the shared one. Continue?")) return;
    sharedRef.current = false;
    persist(tasks, resources, pColors, milestones); // current state IS the shared data (incl. edits made in preview)
    setSharedData(null);
    history.replaceState(null, "", location.href.split("#")[0]);
  };

  const dismissSharedBoard = () => {
    setSharedData(null); sharedRef.current = false;
    history.replaceState(null, "", location.href.split("#")[0]);
    // Reload own data from localStorage
    const r = storage.get(STORAGE_KEY);
    if (r) { try { const d = JSON.parse(r.value); setTasks(normalizeTasks(d.t)); setResources(d.r||[]); setPColors(d.c||{}); setMilestones(d.m||[]); setTimeOff(d.o||[]); } catch {} }
    else { setTasks([]); setResources([]); setPColors({}); setMilestones([]); setTimeOff([]); }
  };

  // ── clear board ───────────────────────────────────────────────────────────
  const clearBoard = () => {
    if (!window.confirm("Delete all tasks, resources and milestones?\nThis cannot be undone.")) return;
    setTasks([]); setResources([]); setPColors({}); setMilestones([]); setTimeOff([]);
    persist([], [], {}, [], []);
  };

  // ── resize observer → keeps mainWidth current ─────────────────────────────
  React.useLayoutEffect(() => {
    if (!mainRef.current) return;
    const update = () => setMainWidth(mainRef.current.clientWidth);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(mainRef.current);
    return () => ro.disconnect();
  }, []);

  // ── filter cleanup ────────────────────────────────────────────────────────
  React.useEffect(() => {
    if (filterResource && !resources.find(r => r.id === filterResource)) setFilterResource("");
  }, [resources]);
  React.useEffect(() => {
    if (filterProject && !tasks.some(t => t.projectName === filterProject)) setFilterProject("");
  }, [tasks]);

  const projects    = [...new Set(tasks.map(t => t.projectName))];
  const sortedTasks = [...tasks].sort((a, b) => a.startDate.localeCompare(b.startDate));

  // ── styles ────────────────────────────────────────────────────────────────
  const S = {
    app:          { fontFamily:"'Segoe UI',system-ui,sans-serif", background:"var(--bg)", height:"100vh", display:"flex", flexDirection:"column", color:"var(--text)" },
    header:       { background:"var(--surface)", borderBottom:"1px solid var(--border)", padding:"10px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:16, flexWrap:"wrap" },
    aside:        { width:256, background:"var(--surface)", borderRight:"1px solid var(--border)", padding:"14px 12px", overflowY:"auto", flexShrink:0, display:"flex", flexDirection:"column", gap:16 },
    main:         { flex:1, overflowY:"auto", overflowX:"hidden", padding:"0 20px 16px", minWidth:0 },   // no top padding: sticky titles carry it, so nothing peeks above them
    label:        { fontSize:11, fontWeight:600, color:"var(--text-dimmer)", letterSpacing:"0.12em" },
    input:        { width:"100%", padding:"7px 9px", borderRadius:6, border:"1px solid var(--border)", background:"var(--input-bg)", color:"var(--text)", fontSize:13, outline:"none" },
    btn:          active => ({ padding:"5px 12px", borderRadius:6, border:"none", cursor:"pointer", fontSize:13, fontWeight:600, background:active?"#2563EB":"var(--btn-bg)", color:active?"#fff":"var(--btn-color)" }),
    card:         { background:"var(--card-bg)", borderRadius:6, padding:"8px 10px", marginBottom:6 },
    sectionTitle: { fontSize:12, fontWeight:700, color:"var(--text-dimmer)", letterSpacing:"0.1em", marginBottom:10 },
    sectionBox:   { background:"var(--surface)", borderRadius:10, border:"1px solid var(--border)", overflow:"clip" },
  };

  const renderAllocPicker = (value, onChange) => (
    <div style={{display:"flex", gap:4, alignItems:"center"}}>
      {ALLOC_PRESETS.map(p => (
        <button key={p} type="button" onClick={() => onChange(p)} style={{...S.btn(value===p), padding:"4px 9px", fontSize:12}}>{p}%</button>
      ))}
      <input type="number" min="1" max="100" step="5" placeholder="other"
        value={ALLOC_PRESETS.includes(value) ? "" : value}
        onChange={e => e.target.value !== "" && onChange(Math.min(100, Math.max(1, parseInt(e.target.value) || 1)))}
        style={{...S.input, width:62, flex:"none", textAlign:"center", padding:"4px 4px", borderColor: ALLOC_PRESETS.includes(value) ? "var(--border)" : "#2563EB"}} />
    </div>
  );

  // ── Gantt column header label ─────────────────────────────────────────────
  const ganttColLabel = (col) => {
    const d = col.date;
    if (granularity === 'day') {
      return (
        <>
          {d.getDate()}
          <br/>
          <span style={{fontWeight:400, opacity:0.65}}>
            {d.toLocaleDateString("en-GB", {weekday:"narrow"})}
          </span>
        </>
      );
    }
    if (granularity === 'week') {
      return (
        <>
          <span style={{fontWeight:800}}>W{getISOWeek(d)}</span>
          <br/>
          <span style={{fontWeight:400, opacity:0.8}}>{fmtShort(d)}</span>
        </>
      );
    }
    // month
    return d.toLocaleDateString("en-GB", {month:"short"}) + " '" + String(d.getFullYear()).slice(2);
  };

  // heatmap column label (always weekly, but label adapts to granularity)
  const heatColLabel = (w) => {
    if (heatColW >= 50) {
      return granularity === 'week'
        ? `W${getISOWeek(w)}  ${fmtShort(w)}`
        : fmtShort(w);
    }
    if (heatColW >= 28) return `W${getISOWeek(w)}`;
    return ""; // too narrow (month view)
  };

  // ── Gantt grouping (by resource or by project) ────────────────────────────
  // Pack tasks into lanes so overlapping bars on the same row don't collide
  const packLanes = ts => {
    const laneEnds = [];
    const items = [...ts].sort((a, b) => a.startDate.localeCompare(b.startDate)).map(task => {
      let lane = laneEnds.findIndex(end => end < task.startDate);
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(task.endDate); } else laneEnds[lane] = task.endDate;
      return { task, lane };
    });
    return { items, lanes: Math.max(1, laneEnds.length) };
  };

  const loadBadge = n => ({ background: n>=3?"#7F1D1D":n===2?"#78350F":"#1E3A5F", color: n>=3?"#FCA5A5":n===2?"#FDE68A":"#93C5FD" });

  const ganttTasks = tentMode === "hide" ? tasks.filter(t => !t.tentative) : tasks;
  const hasTentative = tasks.some(t => t.tentative);

  const ganttGroups = (() => {
    const visibleRes = resources.filter(res => !filterResource || res.id === filterResource);
    if (groupBy === "resource") {
      return visibleRes.map(res => {
        const resTasks = ganttTasks.filter(t => t.resourceIds.includes(res.id) && (!filterProject || t.projectName===filterProject));
        return {
          key: res.id, name: res.name, resId: res.id,
          badge: resTasks.length, badgeTitle: `${resTasks.length} task(s)`, badgeStyle: loadBadge(resTasks.length),
          rows: resTasks.map(t => ({ key: t.id, label: t.taskName, dot: pColors[t.projectName]||"#3B82F6", tasks: [t], resId: res.id })),
        };
      }).filter(g => g.rows.length);
    }
    // by project: projects ordered by earliest start, one row per person involved
    const firstStart = p => tasks.filter(t => t.projectName===p).map(t => t.startDate).sort()[0];
    return [...projects]
      .filter(p => !filterProject || p === filterProject)
      .sort((a, b) => firstStart(a).localeCompare(firstStart(b)))
      .map(p => {
        const pTasks = ganttTasks.filter(t => t.projectName===p);
        const rows = visibleRes
          .map(res => ({ key: `${p}|${res.id}`, label: res.name, resId: res.id, tasks: pTasks.filter(t => t.resourceIds.includes(res.id)) }))
          .filter(r => r.tasks.length);
        const unassigned = pTasks.filter(t => !t.resourceIds.some(id => resources.find(r => r.id === id)));
        if (unassigned.length && !filterResource) rows.push({ key: `${p}|-`, label: "Unassigned", muted: true, tasks: unassigned });
        const people = rows.filter(r => !r.muted).length;
        return {
          key: p, name: p, color: pColors[p]||"#3B82F6",
          badge: people, badgeTitle: `${people} ${people===1?"person":"people"} involved`,
          badgeStyle: { background:"var(--btn-bg)", color:"var(--text-muted)", border:"1px solid var(--border)" },
          rows,
        };
      }).filter(g => g.rows.length);
  })();

  // Bar grab zone: outer 7px of each edge resizes, the rest moves (short bars only move)
  const barEdgeMode = e => {
    const rect = e.currentTarget.getBoundingClientRect();
    if (rect.width < 28) return "move";
    const x = e.clientX - rect.left;
    return x <= 7 ? "start" : x >= rect.width - 7 ? "end" : "move";
  };

  // Time-off blocks for one person, positioned like bars. Drawn above bars so a clash is visible.
  const renderTimeOff = (resId, withLabel) => timeOff.filter(o => o.resourceId === resId).map(o => {
    const bs = barStyle(o);
    return (
      <div key={o.id} title={withLabel ? `${o.label || "Time off"}: ${o.startDate} → ${o.endDate}` : undefined}
        style={{position:"absolute", top:0, bottom:0, ...bs, background:OFF_HATCH, zIndex: withLabel ? 1 : 2,
                pointerEvents: withLabel ? "auto" : "none", borderLeft:"1px solid var(--off-stripe)", borderRight:"1px solid var(--off-stripe)",
                display:"flex", alignItems:"center", overflow:"hidden", whiteSpace:"nowrap"}}>
        {withLabel && <span style={{fontSize:11, fontWeight:600, color:"var(--text-dim)", padding:"0 6px"}}>🌴{parseFloat(bs.width) >= 90 ? ` ${o.label || "Time off"}` : ""}</span>}
      </div>
    );
  });

  // One Gantt row: fixed label column + timeline with bars packed into lanes
  const LANE_H = 32;
  const renderGanttRow = row => {
    const { items, lanes } = packLanes(row.tasks);
    const rowH = lanes * LANE_H + 12;
    return (
      <div key={row.key} style={{display:"flex", borderTop:"1px solid var(--border-subtle)", minHeight:44}}>
        {/* Fixed label column */}
        <div style={{width:LABEL_W, flexShrink:0, padding:"3px 10px", fontSize:12, color:"var(--text-dim)", fontStyle: row.muted ? "italic" : "normal", borderRight:"1px solid var(--border)", display:"flex", alignItems:"center", gap:6, position:"sticky", left:0, background:"var(--bg)", zIndex:3}}>
          {row.dot && <div style={{width:7, height:7, borderRadius:2, background:row.dot, flexShrink:0}} />}
          <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}} title={row.label}>{row.label}</span>
        </div>
        {/* Timeline area */}
        <div style={{width:sharedTimelineW, height:rowH, position:"relative"}}>
          {/* Column stripes */}
          {ganttColPositions.map((cp, i) => {
            const isWE = granularity === 'day' && (cp.date.getDay() === 0 || cp.date.getDay() === 6);
            return (isWE || i%2===0) ? (
              <div key={i} style={{position:"absolute", top:0, bottom:0, left:cp.left, width:cp.width,
                background: isWE ? "var(--weekend-bg)" : "var(--row-alt)"}} />
            ) : null;
          })}
          {/* Today line */}
          {todayLeft!==null && (
            <div style={{position:"absolute", top:0, bottom:0, left:todayLeft, width:1, background:"rgba(239,68,68,0.5)", zIndex:2}} />
          )}
          {row.resId && renderTimeOff(row.resId, false)}
          {items.map(({ task, lane }) => {
            const col = pColors[task.projectName]||"#3B82F6";
            const bs  = barStyle(task);
            const pct = (task.completion != null && task.completion > 0) ? Math.min(100, task.completion) : 0;
            const light = allocOf(task) < LIGHT_BELOW;
            const tent  = !!task.tentative;
            const top = 9 + lane * LANE_H + (light ? 2 : 0);
            return (
              <React.Fragment key={task.id}>
                {/* Completion strip */}
                {pct > 0 && <>
                  <div style={{position:"absolute", left:bs.left, width:bs.width, height:3, top:top+(light ? 21 : 25), background:"var(--progress-track)", borderRadius:2, zIndex:2}} />
                  <div style={{position:"absolute", left:bs.left, width:`${parseFloat(bs.width)*pct/100}px`, height:3, top:top+(light ? 21 : 25), background:"var(--progress-fill)", borderRadius:2, zIndex:3}} />
                </>}
                {/* Gantt bar */}
                <div
                  onClick={() => { if (!lastDragMovedRef.current) openEditModal(task); lastDragMovedRef.current = false; }}
                  onMouseMove={e => {
                    if (dragRef.current) return;
                    e.currentTarget.style.cursor = barEdgeMode(e) === "move" ? "grab" : "ew-resize";
                  }}
                  onMouseDown={e => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    const el = e.currentTarget;
                    const mode = barEdgeMode(e);
                    const days = Math.round((parseDate(task.endDate) - parseDate(task.startDate)) / 86400000) + 1;
                    dragRef.current = { taskId:task.id, mode, days, startX:e.clientX, origStart:task.startDate, origEnd:task.endDate,
                                        origLeft:parseFloat(el.style.left), origWidth:parseFloat(el.style.width), el, deltaDays:0,
                                        snap:{resources, pColors, milestones} };
                    el.style.opacity = "0.75";
                    document.body.style.cursor = mode === "move" ? "grabbing" : "ew-resize";
                    document.body.style.userSelect = "none";
                  }}
                  title={(() => {
                    const names = (task.resourceIds||[]).map(id=>resources.find(r=>r.id===id)?.name).filter(Boolean).join(", ");
                    const days = Math.round((parseDate(task.endDate) - parseDate(task.startDate)) / 86400000) + 1;
                    const dur = days >= 14 ? `${Math.round(days/7)} weeks` : `${days} day${days!==1?"s":""}`;
                    return [
                      task.taskName,
                      task.projectName,
                      `${task.startDate} → ${task.endDate}  (${dur})`,
                      names ? `Resources: ${names}` : null,
                      tent ? "TENTATIVE — not confirmed yet" : null,
                      allocOf(task) < 100 ? `Effort: ${allocOf(task)}% of their time` : null,
                      task.completion > 0 ? `${task.completion}% complete` : null,
                      task.notes ? `\n${task.notes}` : null,
                    ].filter(Boolean).join("\n");
                  })()}
                  style={{
                    position:"absolute", ...bs, top,
                    height: light ? 22 : 26, borderRadius:5,
                    background: tent ? `repeating-linear-gradient(135deg, ${col}66 0 6px, ${col}1F 6px 12px)` : light ? `${col}33` : col, opacity:0.92,
                    border: tent ? `1.5px dashed ${col}` : light ? `1px solid ${col}` : "none", borderLeft: tent ? `1.5px dashed ${col}` : light ? `4px solid ${col}` : "none",
                    display:"flex", alignItems:"center", padding: light ? "0 8px 0 5px" : "0 8px",
                    fontSize:12, color: light || tent ? "var(--text)" : "#fff", fontWeight:600, fontStyle: tent ? "italic" : "normal",
                    overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis",
                    cursor:"grab", zIndex:1,
                    boxShadow: light || tent ? "none" : "0 0 0 1px rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.4)"
                  }}
                >
                  {/* By resource the project prefixes the task; it never shrinks first — the task name truncates */}
                  {groupBy === "resource" && <>
                    <span style={{flexShrink:0, maxWidth:"100%", overflow:"hidden", textOverflow:"ellipsis", fontSize:11, fontWeight:600, fontStyle:"normal", letterSpacing:"0.05em", textTransform:"uppercase", opacity:0.75}}>{task.projectName}</span>
                    <span style={{flexShrink:0, opacity:0.55, margin:"0 5px"}}>·</span>
                  </>}
                  <span style={{minWidth:0, overflow:"hidden", textOverflow:"ellipsis"}}>{task.taskName}</span>
                  {allocOf(task) < 100 && (
                    <span style={{marginLeft:6, padding:"0 5px", borderRadius:8, background: light || tent ? col : "rgba(0,0,0,0.28)", color:"#fff", fontSize:11, fontWeight:600, flexShrink:0}}>{allocOf(task)}%</span>
                  )}
                  {tent && (
                    <span style={{marginLeft:6, padding:"0 5px", borderRadius:8, border:`1px dashed ${col}`, fontSize:11, fontWeight:600, fontStyle:"normal", letterSpacing:"0.04em", flexShrink:0}}>TENTATIVE</span>
                  )}
                  {task.notes && (
                    <div style={{position:"absolute", top:3, right:4, width:5, height:5, borderRadius:"50%", background: light || tent ? col : "#fff", opacity: light || tent ? 0.9 : 0.6, flexShrink:0}} />
                  )}
                </div>
              </React.Fragment>
            );
          })}
        </div>
      </div>
    );
  };

  // ── render ────────────────────────────────────────────────────────────────
  return (
    <div id="pm-app" style={S.app}>
      <header style={S.header}>
        <div style={{display:"flex", alignItems:"baseline", gap:12}}>
          <span style={{fontWeight:800, fontSize:16, letterSpacing:"-0.5px", color:"var(--text-bright)"}}>PM Workload Board</span>
          <span style={{fontFamily:"monospace", fontSize:12, color:"var(--text-faint)"}}>{tasks.length} tasks · {resources.length} resources</span>
        </div>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
          {/* View toggle */}
          {["gantt","heatmap","both"].map(v => (
            <button key={v} style={S.btn(view===v)} onClick={() => setView(v)}>
              {v==="both"?"Both":v.charAt(0).toUpperCase()+v.slice(1)}
            </button>
          ))}
          <div style={{width:1, height:18, background:"var(--border)", margin:"0 4px"}} />
          {/* Granularity toggle */}
          {["day","week","month"].map(g => (
            <button key={g} style={S.btn(granularity===g)} onClick={() => changeGranularity(g)}>
              {g.charAt(0).toUpperCase()+g.slice(1)}
            </button>
          ))}
          <div style={{width:1, height:18, background:"var(--border)", margin:"0 4px"}} />
          <button onClick={toggleTheme} title={theme==="dark"?"Switch to light theme":"Switch to dark theme"} style={S.btn(false)}>
            {theme==="dark" ? "☀" : "🌙"}
          </button>
          <div style={{width:1, height:18, background:"var(--border)", margin:"0 4px"}} />
          <button onClick={shareBoard} className="no-print" style={{...S.btn(false), color:"#60A5FA"}}>🔗 Share</button>
          <button onClick={exportJSON} className="no-print" style={{...S.btn(false), color:"#34D399"}}>⬇ Export</button>
          <label className="no-print" style={{...S.btn(false), color:"#60A5FA", cursor:"pointer"}}>
            ⬆ Import<input type="file" accept=".json" onChange={importJSON} style={{display:"none"}} />
          </label>
          <button onClick={() => window.print()} className="no-print" style={{...S.btn(false), color:"#A78BFA"}}>🖨 Print</button>
          <button onClick={() => setSideOpen(o=>!o)} style={S.btn(false)} title="Toggle sidebar">☰</button>
        </div>
      </header>

      {/* SHARED BOARD BANNER */}
      {sharedData && (
        <div style={{background:"#1E3A5F", borderBottom:"1px solid #2D5F8A", padding:"9px 20px", display:"flex", alignItems:"center", gap:12, flexShrink:0, flexWrap:"wrap"}}>
          <span style={{fontSize:13, fontWeight:600, color:"#93C5FD"}}>👁 Viewing a shared board</span>
          <span style={{fontSize:12, color:"#7AADDB"}}>
            {sharedData.t?.length || 0} tasks · {sharedData.r?.length || 0} resources · {sharedData.m?.length || 0} milestones — changes are not saved
          </span>
          <div style={{marginLeft:"auto", display:"flex", gap:8}}>
            <button
              onClick={importSharedBoard}
              style={{padding:"5px 16px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", fontSize:12, fontWeight:600, cursor:"pointer"}}
            >
              Import to my board
            </button>
            <button
              onClick={dismissSharedBoard}
              style={{padding:"5px 12px", borderRadius:6, border:"1px solid #2D5F8A", background:"transparent", color:"#93C5FD", fontSize:12, cursor:"pointer"}}
            >
              Dismiss
            </button>
          </div>
        </div>
      )}

      <div id="pm-layout" style={{display:"flex", flex:1, minHeight:0, overflow:"hidden"}}>
        {sideOpen && (
          <aside id="pm-sidebar" style={S.aside}>

            {/* RESOURCES — collapsible + chips */}
            <div>
              <ColHdr label="RESOURCES" count={resources.length} open={resOpen} onToggle={() => setResOpen(o=>{ const n=!o; try{localStorage.setItem("pm-gantt-resOpen",n?"1":"0");}catch{} return n; })} />
              {resOpen && (
                <div style={{marginTop:10}}>
                  {resources.length > 0 && (
                    <div style={{display:"flex", flexWrap:"wrap", gap:5, marginBottom:8}}>
                      {resources.map(r => (
                        <div key={r.id} style={{display:"flex", alignItems:"center", gap:3, background:"var(--btn-bg)", border:"1px solid var(--border)", borderRadius:12, padding:"3px 6px 3px 10px", fontSize:12, color:"var(--text)"}}>
                          <span>{r.name}</span>
                          <button onClick={() => delResource(r.id)} style={{background:"none", border:"none", color:"var(--text-dimmer)", cursor:"pointer", fontSize:14, lineHeight:1, padding:"0 2px", display:"flex", alignItems:"center"}}>×</button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{display:"flex", gap:4}}>
                    <input value={newRes} onChange={e=>setNewRes(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addResource()} placeholder="Add resource…" style={S.input} />
                    <button onClick={addResource} style={{padding:"7px 11px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", cursor:"pointer", fontSize:16, fontWeight:700, flexShrink:0}}>+</button>
                  </div>
                </div>
              )}
            </div>

            {resources.length > 0 && (
              <div>
                <div style={{...S.label, marginBottom:6}}>FILTER BY RESOURCE</div>
                <select
                  value={filterResource}
                  onChange={e => setFilterResource(e.target.value)}
                  style={{...S.input, color: filterResource ? "var(--text)" : "var(--text-dimmer)"}}
                >
                  <option value="">All resources</option>
                  {resources.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
            )}

            {projects.length > 0 && (
              <div>
                <div style={{...S.label, marginBottom:6}}>FILTER BY PROJECT</div>
                <select
                  value={filterProject}
                  onChange={e => setFilterProject(e.target.value)}
                  style={{...S.input, color: filterProject ? "var(--text)" : "var(--text-dimmer)"}}
                >
                  <option value="">All projects</option>
                  {projects.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            )}

            {projects.length > 0 && (
              <div>
                <ColHdr label="PROJECTS" count={projects.length} open={projOpen} onToggle={() => setProjOpen(o=>{ const n=!o; try{localStorage.setItem("pm-gantt-projOpen",n?"1":"0");}catch{} return n; })} />
                {projOpen && <div style={{marginTop:8}}>{projects.map(p => (
                  <div key={p} style={{display:"flex", alignItems:"center", gap:7, marginBottom:4}}>
                    <div style={{width:10, height:10, borderRadius:2, background:pColors[p], flexShrink:0}} />
                    <span style={{fontSize:12, color:"var(--text-muted)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p}</span>
                  </div>
                ))}</div>}
              </div>
            )}

            {/* MILESTONES — collapsible */}
            <div>
              <ColHdr label="MILESTONES" count={milestones.length} open={msOpen} onToggle={() => setMsOpen(o=>{ const n=!o; try{localStorage.setItem("pm-gantt-msOpen",n?"1":"0");}catch{} return n; })} />
              {msOpen && (
                <div style={{marginTop:10}}>
                  <input value={mForm.name} onChange={e=>setMForm({...mForm,name:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addMilestone()} placeholder="Milestone name" style={{...S.input, marginBottom:5}} />
                  <input type="date" lang="en-GB" value={mForm.date} onChange={e=>setMForm({...mForm,date:e.target.value})} style={{...S.input, marginBottom:6, fontSize:12}} />
                  <div style={{display:"flex", gap:6, marginBottom:6, alignItems:"center"}}>
                    {MILESTONE_COLORS.map(col => (
                      <div key={col} onClick={() => setMForm({...mForm,color:col})} style={{width:18, height:18, borderRadius:"50%", background:col, cursor:"pointer", flexShrink:0, boxShadow:mForm.color===col?`0 0 0 2px var(--surface), 0 0 0 4px ${col}`:"none"}} />
                    ))}
                  </div>
                  <button onClick={addMilestone} style={{width:"100%", padding:"6px", borderRadius:6, border:"none", background:"var(--btn-bg)", color:"var(--text)", fontSize:12, fontWeight:600, cursor:"pointer", marginBottom:6}}>+ Add Milestone</button>
                  {milestones.map(m => (
                    <div key={m.id} style={{display:"flex", alignItems:"center", gap:6, marginBottom:4}}>
                      <div style={{width:3, height:16, background:m.color, borderRadius:1, flexShrink:0}} />
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{fontSize:12, color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{m.name}</div>
                        <div style={{fontSize:11, color:"var(--text-dimmer)"}}>{m.date}</div>
                      </div>
                      <button onClick={()=>delMilestone(m.id)} style={{background:"none", border:"none", color:"var(--text-dimmer)", cursor:"pointer", fontSize:14, flexShrink:0}}>×</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* TIME OFF — collapsible */}
            <div>
              <ColHdr label="TIME OFF" count={timeOff.length} open={offOpen} onToggle={() => setOffOpen(o=>{ const n=!o; try{localStorage.setItem("pm-gantt-offOpen",n?"1":"0");}catch{} return n; })} />
              {offOpen && (
                <div style={{marginTop:10}}>
                  {resources.length === 0
                    ? <span style={{fontSize:12, color:"var(--text-dimmer)"}}>Add resources first</span>
                    : <>
                      <select value={oForm.resourceId || resources[0].id} onChange={e=>setOForm({...oForm, resourceId:e.target.value})} style={{...S.input, marginBottom:5}}>
                        {resources.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                      </select>
                      <div style={{display:"flex", gap:4, marginBottom:5}}>
                        <input type="date" lang="en-GB" value={oForm.startDate} onChange={e=>setOForm({...oForm, startDate:e.target.value})} title="First day off" style={{...S.input, flex:1, minWidth:0, fontSize:12}} />
                        <input type="date" lang="en-GB" value={oForm.endDate} onChange={e=>setOForm({...oForm, endDate:e.target.value})} title="Last day off (empty = single day)" style={{...S.input, flex:1, minWidth:0, fontSize:12}} />
                      </div>
                      <input value={oForm.label} onChange={e=>setOForm({...oForm, label:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addTimeOff()} placeholder="Holiday, sick leave… (optional)" style={{...S.input, marginBottom:6}} />
                      <button onClick={addTimeOff} style={{width:"100%", padding:"6px", borderRadius:6, border:"none", background:"var(--btn-bg)", color:"var(--text)", fontSize:12, fontWeight:600, cursor:"pointer", marginBottom:6}}>+ Add time off</button>
                    </>}
                  {[...timeOff].sort((a, b) => a.startDate.localeCompare(b.startDate)).map(o => (
                    <div key={o.id} style={{display:"flex", alignItems:"center", gap:6, marginBottom:4}}>
                      <div style={{width:14, height:16, borderRadius:2, background:OFF_HATCH, border:"1px solid var(--border)", flexShrink:0}} />
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{fontSize:12, color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                          {resources.find(r => r.id === o.resourceId)?.name || "?"}{o.label ? ` · ${o.label}` : ""}
                        </div>
                        <div style={{fontSize:11, color:"var(--text-dimmer)"}}>{o.startDate === o.endDate ? o.startDate : `${o.startDate} → ${o.endDate}`}</div>
                      </div>
                      <button onClick={()=>delTimeOff(o.id)} style={{background:"none", border:"none", color:"var(--text-dimmer)", cursor:"pointer", fontSize:14, flexShrink:0}}>×</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* NEW TASK / EDIT TASK */}
            <div>
              <div style={{...S.label, marginBottom:8}}>{form.id?"EDIT TASK":"NEW TASK"}</div>
              <input value={form.taskName} onChange={e=>setForm({...form,taskName:e.target.value})} onKeyDown={e=>e.key==="Enter"&&submitForm()} placeholder="Task name" style={{...S.input, marginBottom:5}} />
              <input value={form.projectName} onChange={e=>{ const projectName = e.target.value; setForm(f => ({...f, projectName, allocation: f.allocTouched ? f.allocation : projectAlloc(projectName)})); }} onKeyDown={e=>e.key==="Enter"&&submitForm()} placeholder="Project name" style={{...S.input, marginBottom:5}} list="projects-list" />
              <datalist id="projects-list">{projects.map(p=><option key={p} value={p}/>)}</datalist>
              <div style={{border:"1px solid var(--border)", borderRadius:6, background:"var(--input-bg)", marginBottom:5, padding:"5px 9px", maxHeight:96, overflowY:"auto"}}>
                {resources.length === 0
                  ? <span style={{fontSize:12, color:"var(--text-dimmer)"}}>Add resources first</span>
                  : resources.map(r => (
                      <label key={r.id} style={{display:"flex", alignItems:"center", gap:7, padding:"3px 0", cursor:"pointer"}}>
                        <input type="checkbox" checked={form.resourceIds.includes(r.id)}
                          onChange={e => {
                            const ids = e.target.checked ? [...form.resourceIds, r.id] : form.resourceIds.filter(x=>x!==r.id);
                            setForm({...form, resourceIds: ids});
                          }}
                          style={{accentColor:"#2563EB", cursor:"pointer"}} />
                        <span style={{fontSize:12, color:"var(--text)"}}>{r.name}</span>
                      </label>
                    ))
                }
              </div>
              <div style={{display:"flex", gap:4, marginBottom:5}}>
                <input type="date" lang="en-GB" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} style={{...S.input, flex:1, minWidth:0, fontSize:12}} />
                <input type="date" lang="en-GB" value={form.endDate} onChange={e=>setForm({...form,endDate:e.target.value})} style={{...S.input, flex:1, minWidth:0, fontSize:12}} />
              </div>
              {/* Optional fields stay folded away; the summary shows any non-default value */}
              <div onClick={() => setMoreOpen(o => { const n=!o; try{localStorage.setItem("pm-gantt-moreOpen",n?"1":"0");}catch{} return n; })}
                style={{display:"flex", alignItems:"center", gap:6, cursor:"pointer", userSelect:"none", padding:"3px 0", marginBottom:5, fontSize:12, color:"var(--text-dim)"}}>
                <span style={{display:"flex", width:12}}><Chevron open={moreOpen} /></span>
                <span>More options</span>
                {!moreOpen && (() => {
                  const bits = [form.tentative && "tentative", form.allocation !== 100 && `${form.allocation}% effort`, form.notes && "notes", form.completion !== "" && `${form.completion}% done`].filter(Boolean);
                  return bits.length ? <span style={{color:"#60A5FA", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>· {bits.join(" · ")}</span> : null;
                })()}
              </div>
              {moreOpen && (
                <div style={{paddingLeft:4, marginBottom:4}}>
                  <label style={{display:"flex", alignItems:"center", gap:7, marginBottom:8, cursor:"pointer", fontSize:12, color:"var(--text)"}}>
                    <input type="checkbox" checked={!!form.tentative} onChange={e => setForm(f => ({...f, tentative:e.target.checked}))} style={{accentColor:"#2563EB", cursor:"pointer"}} />
                    Tentative <span style={{color:"var(--text-dimmer)"}}>— not confirmed yet</span>
                  </label>
                  <div style={{fontSize:12, color:"var(--text-dim)", marginBottom:4}}>Effort <span style={{color:"var(--text-dimmer)"}}>— share of each person's time</span></div>
                  <div style={{marginBottom:8}}>{renderAllocPicker(form.allocation, v => setForm(f => ({...f, allocation:v, allocTouched:true})))}</div>
                  <textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Notes (optional)" rows={2} style={{...S.input, marginBottom:5, resize:"vertical", fontFamily:"inherit", lineHeight:1.4}} />
                  <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:4}}>
                    <input type="number" min="0" max="100" value={form.completion} onChange={e=>setForm({...form,completion:e.target.value})} placeholder="—" style={{...S.input, width:56, flex:"none", textAlign:"center"}} />
                    <span style={{fontSize:12, color:"var(--text-dim)"}}>% complete</span>
                  </div>
                </div>
              )}
              <div style={{height:4}} />
              <button onClick={submitForm} style={{width:"100%", padding:"8px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", fontSize:13, fontWeight:600, cursor:"pointer"}}>
                {form.id?"Save changes":"Add"}
              </button>
              {form.id && (
                <button onClick={cancelForm}
                  style={{width:"100%", padding:"6px", borderRadius:6, border:"1px solid var(--border)", background:"transparent", color:"var(--text-dim)", fontSize:12, cursor:"pointer", marginTop:4}}>
                  Cancel
                </button>
              )}
            </div>

            {/* TASKS LIST — sorted by start date, collapsible */}
            {tasks.length > 0 && (
              <div style={{flex:1, overflowY:"auto", minHeight:0}}>
                <ColHdr label="TASKS" count={tasks.length} open={tasksOpen} onToggle={() => setTasksOpen(o=>{ const n=!o; try{localStorage.setItem("pm-gantt-tasksOpen",n?"1":"0");}catch{} return n; })} />
                {tasksOpen && <div style={{marginTop:8}}>{sortedTasks.map(t => {
                  const resNames = (t.resourceIds||[]).map(id=>resources.find(r=>r.id===id)?.name).filter(Boolean).join(", ");
                  const col = pColors[t.projectName]||"#3B82F6";
                  return (
                    <div key={t.id} style={{...S.card, borderLeft: t.tentative ? `3px dashed ${col}` : `3px solid ${col}`, marginBottom:5}}>
                      <div style={{fontSize:13, fontWeight:600, color:"var(--text)", marginBottom:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                        {t.tentative && <span style={{fontSize:10, fontWeight:700, letterSpacing:"0.05em", color:"var(--text-dim)", border:"1px dashed var(--text-dimmer)", borderRadius:6, padding:"0 4px", marginRight:6}}>TENTATIVE</span>}
                        {t.taskName}
                      </div>
                      <div style={{fontSize:11, color:"var(--text-dim)"}}>{t.projectName}</div>
                      <div style={{fontSize:11, color:"var(--text-dimmer)"}}>{resNames} · {t.startDate} → {t.endDate}{allocOf(t) < 100 ? ` · ${allocOf(t)}% effort` : ""}{t.completion > 0 ? ` · ${t.completion}% done` : ""}</div>
                      <div style={{display:"flex", gap:5, marginTop:6}}>
                        {t.tentative && <button onClick={()=>confirmTask(t.id)} title="Mark as confirmed" style={{flex:1, padding:"3px 0", borderRadius:4, border:"none", background:"rgba(6,214,160,0.18)", color:"#06D6A0", fontSize:11, fontWeight:600, cursor:"pointer"}}>✓ Confirm</button>}
                        <button onClick={()=>editTask(t)} style={{flex:1, padding:"3px 0", borderRadius:4, border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)", fontSize:11, cursor:"pointer"}}>✏ Edit</button>
                        <button onClick={()=>delTask(t.id)} style={{flex:1, padding:"3px 0", borderRadius:4, border:"none", background:"rgba(127,29,29,0.5)", color:"#FCA5A5", fontSize:11, cursor:"pointer"}}>✕ Del</button>
                      </div>
                    </div>
                  );
                })}</div>}
              </div>
            )}
            {/* CLEAR BOARD — bottom of sidebar, danger zone */}
            <div style={{marginTop:"auto", paddingTop:10, borderTop:"1px solid var(--border)"}}>
              <button
                onClick={clearBoard}
                style={{width:"100%", padding:"6px 10px", borderRadius:6, border:"1px solid rgba(127,29,29,0.5)", background:"transparent", color:"#F87171", fontSize:12, fontWeight:600, cursor:"pointer", letterSpacing:"0.04em"}}
              >
                ⊘ Clear board
              </button>
            </div>
          </aside>
        )}

        <main ref={mainRef} style={S.main}>
          {tasks.length === 0 ? (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"80vh", color:"var(--text-faint)", gap:8}}>
              <div style={{fontSize:48}}>📊</div>
              <div style={{fontSize:15, fontWeight:700, color:"var(--text-dim)"}}>No tasks yet</div>
              <div style={{fontSize:12, color:"var(--text-faint)"}}>Add resources and tasks from the left panel</div>
              <button onClick={loadSampleData} style={{marginTop:8, padding:"7px 18px", borderRadius:6, border:"1px solid var(--border)", background:"transparent", color:"var(--text-dim)", fontSize:12, fontWeight:600, cursor:"pointer"}}>Load sample data</button>
            </div>
          ) : (
            <div style={{display:"flex", flexDirection:"column", gap:24}}>

              {/* ── GANTT ────────────────────────────────────────────────── */}
              {(view==="gantt"||view==="both") && (
                <div>
                  <div ref={ganttTitleRef} className="pm-sticky" style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, padding:"14px 0 10px", flexWrap:"wrap", position:"sticky", top:0, zIndex:12, background:"var(--bg)"}}>
                    <div style={{...S.sectionTitle, marginBottom:0}}>GANTT — IMPLEMENTATION TIMELINE</div>
                    <div className="no-print" style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
                      {hasTentative && <>
                        <span style={{fontSize:11, color:"var(--text-dimmer)", fontWeight:600, letterSpacing:"0.08em"}} title="Show: visible but not counted in the heatmap · Count: what-if, included in the load">TENTATIVE</span>
                        {[["hide","Hide"],["show","Show"],["count","Count"]].map(([v, lbl]) => (
                          <button key={v} style={{...S.btn(tentMode===v), padding:"3px 10px", fontSize:12}} onClick={() => changeTentMode(v)}>{lbl}</button>
                        ))}
                        <div style={{width:1, height:16, background:"var(--border)", margin:"0 6px"}} />
                      </>}
                      <span style={{fontSize:11, color:"var(--text-dimmer)", fontWeight:600, letterSpacing:"0.08em"}}>GROUP BY</span>
                      {[["resource","Resource"],["project","Project"]].map(([g, lbl]) => (
                        <button key={g} style={{...S.btn(groupBy===g), padding:"3px 10px", fontSize:12}} onClick={() => changeGroupBy(g)}>{lbl}</button>
                      ))}
                    </div>
                  </div>
                  <div style={S.sectionBox}>

                    {/* Sticky column header */}
                    <div style={{display:"flex", borderBottom:"1px solid var(--border)", background:"var(--surface-2)", position:"sticky", top:ganttTitleH, zIndex:10}} className="pm-sticky">
                      <div style={{width:LABEL_W, flexShrink:0, padding:"7px 10px", fontSize:11, color:"var(--text-faint)", borderRight:"1px solid var(--border)", position:"relative", zIndex:11, background:"var(--surface-2)"}}>{groupBy==="project" ? "Project / Resource" : "Resource / Task"}</div>
                      <div style={{flex:1, overflow:"clip"}}>
                        <div ref={ganttHeaderRef} style={{display:"flex"}}>
                          {ganttColPositions.map((col, i) => {
                            const d = col.date;
                            const isWeekend = granularity === 'day' && (d.getDay() === 0 || d.getDay() === 6);
                            return (
                              <div key={i} style={{
                                width: col.width,
                                flexShrink: 0,
                                padding: granularity === 'day' ? "4px 2px" : "5px 3px",
                                fontSize: granularity === 'day' ? 10 : 11,
                                color: isWeekend ? "var(--text-faint)" : "var(--text-dimmer)",
                                textAlign: "center",
                                lineHeight: 1.35,
                                borderRight: i < ganttColPositions.length-1 ? "1px solid var(--border)" : "",
                                background: isWeekend ? "var(--weekend-bg)" : i%2===0 ? "var(--row-alt)" : "transparent",
                                fontWeight: 600,
                                letterSpacing: "0.02em",
                                overflow: "hidden",
                              }}>
                                {ganttColLabel(col)}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {/* Horizontally scrollable body */}
                    <div ref={ganttScrollRef} style={{overflowX:"auto"}} onScroll={handleGanttScroll}>
                      <div style={{minWidth: LABEL_W + sharedTimelineW, position:"relative"}}>

                        {/* Milestone overlays: thin dashed line drawn *under* bars (same z as bars, earlier in the DOM)
                            and under the sticky label column; never catches clicks. Today stays the only solid red line. */}
                        {milestones.map(m => {
                          const mLeft = (parseDate(m.date) - timelineStart) / 86400000 * dayW;
                          if (mLeft < 0 || mLeft > sharedTimelineW) return null;
                          return (
                            <div key={m.id} style={{position:"absolute", top:0, bottom:0, left:LABEL_W+mLeft, width:0, borderLeft:`1px dashed ${m.color}B3`, zIndex:1, pointerEvents:"none"}}>
                              <div style={{position:"absolute", top:5, left:4, fontSize:11, color:m.color, fontWeight:600, whiteSpace:"nowrap", background:"var(--surface-3)", padding:"1px 5px", borderRadius:3}}>◆ {m.name}</div>
                            </div>
                          );
                        })}

                        {/* Group rows (by resource or by project) */}
                        {ganttGroups.map(g => (
                          <div key={g.key}>
                            {/* Group header row */}
                            <div style={{display:"flex", background:"var(--surface-3)", borderTop:"1px solid var(--border)"}}>
                              <div style={{width:LABEL_W, flexShrink:0, padding:"4px 10px", fontSize:13, fontWeight:700, color:"var(--text-muted)", borderRight:"1px solid var(--border)", display:"flex", alignItems:"center", gap:6, position:"sticky", left:0, background:"var(--surface-3)", zIndex:3}}>
                                {g.color && <div style={{width:8, height:8, borderRadius:2, background:g.color, flexShrink:0}} />}
                                <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}} title={g.name}>{g.name}</span>
                                <span title={g.badgeTitle} style={{flexShrink:0, borderRadius:9, padding:"1px 7px", fontSize:11, fontWeight:700, ...g.badgeStyle}}>
                                  {g.badge}
                                </span>
                              </div>
                              <div style={{width:sharedTimelineW, position:"relative"}}>
                                {g.resId && renderTimeOff(g.resId, true)}
                              </div>
                            </div>
                            {g.rows.map(row => renderGanttRow(row))}
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                  {todayLeft!==null && <div style={{fontSize:11, color:"var(--text-dimmer)", marginTop:5}}>— Red line = today</div>}
                </div>
              )}

              {/* ── HEATMAP ──────────────────────────────────────────────── */}
              {(view==="heatmap"||view==="both") && (
                <div>
                  <div ref={heatTitleRef} className="pm-sticky" style={{...S.sectionTitle, marginBottom:0, padding:"14px 0 10px", position:"sticky", top:0, zIndex:12, background:"var(--bg)"}}>HEATMAP — WEEKLY LOAD BY RESOURCE</div>
                  <div style={S.sectionBox}>

                    {/* Sticky week header */}
                    <div style={{display:"flex", borderBottom:"1px solid var(--border)", background:"var(--surface-2)", position:"sticky", top:heatTitleH, zIndex:10}} className="pm-sticky">
                      <div style={{width:LABEL_W, flexShrink:0, padding:"7px 10px", fontSize:11, color:"var(--text-faint)", borderRight:"1px solid var(--border)", position:"relative", zIndex:11, background:"var(--surface-2)"}}>Resource</div>
                      <div style={{flex:1, overflow:"clip"}}>
                        <div ref={heatHeaderRef} style={{display:"flex"}}>
                          {weeks.map((w,i) => (
                            <div key={i} style={{
                              width: heatColW,
                              flexShrink: 0,
                              padding: "7px 3px",
                              fontSize: heatColW < 30 ? 9 : 11,
                              color: "var(--text-dimmer)",
                              textAlign: "center",
                              borderRight: i<weeks.length-1 ? "1px solid var(--border)" : "",
                              fontWeight: 600,
                              overflow: "hidden",
                              whiteSpace: "nowrap",
                            }}>
                              {heatColLabel(w)}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Horizontally scrollable body */}
                    <div ref={heatScrollRef} style={{overflowX:"auto"}} onScroll={handleHeatScroll}>
                      <div style={{minWidth:LABEL_W + sharedTimelineW}}>
                        {heatmap
                          .filter(h=>tasks.some(t=>t.resourceIds.includes(h.res.id)))
                          .filter(h => !filterResource || h.res.id === filterResource)
                          .map(({res,cols}) => (
                            <div key={res.id} style={{display:"flex", borderTop:"1px solid var(--border)"}}>
                              <div style={{width:LABEL_W, flexShrink:0, padding:"10px", fontSize:13, fontWeight:600, color:"var(--text-heatmap-res)", borderRight:"1px solid var(--border)", display:"flex", alignItems:"center", position:"sticky", left:0, background:"var(--surface)", zIndex:1}}>{res.name}</div>
                              {cols.map(({items, tentItems, tentLoad, load, daysOff, capacity, offLabels, clashes}, i) => {
                                const projItems = filterProject ? items.filter(x => x.task.projectName === filterProject) : items;
                                const projLoad  = Math.round(projItems.reduce((a, x) => a + x.pct, 0));
                                const lvl = loadLevel(load);
                                const line = x => `• ${x.task.tentative ? "[tentative] " : ""}${x.task.taskName} (${x.task.projectName}) — ${Math.round(x.pct)}%` + (allocOf(x.task) < 100 && Math.round(x.pct) !== allocOf(x.task) ? ` (${allocOf(x.task)}% effort)` : "");
                                const tentShown = tentLoad > 0 && tentMode !== "hide";
                                const tooltip = items.length + tentItems.length === 0 && !daysOff ? "" : [
                                  `${res.name} · W${getISOWeek(weeks[i])}: ${load}% of capacity` + (tentMode === "show" && tentLoad > 0 ? ` (+${tentLoad}% tentative, not counted)` : ""),
                                  filterProject ? `${filterProject}: ${projLoad}%` : null,
                                  daysOff ? `🌴 ${offLabels.join(", ")}: ${daysOff} day${daysOff>1?"s":""} off — capacity ${capacity}/5 days` : null,
                                  ...clashes.map(x => `⚠ ${x.task.taskName} is scheduled during time off`),
                                  ...items.map(line),
                                  ...tentItems.map(line),
                                ].filter(Boolean).join("\n");
                                const warn = clashes.length ? "⚠ " : "";
                                const text = capacity === 0 ? `${warn}OFF` : warn + (filterProject ? `${projLoad}/${load}` : heatColW >= 60 ? `${load}%` : `${load}`);
                                return (
                                  <div key={i}
                                    title={tooltip}
                                    style={{
                                      width: heatColW,
                                      flexShrink: 0,
                                      display: "flex",
                                      alignItems: "center",
                                      justifyContent: "center",
                                      backgroundColor: heatBg(lvl),
                                      backgroundImage: daysOff ? OFF_HATCH : "none",
                                      borderRight: i<weeks.length-1 ? "1px solid var(--border-subtle)" : "",
                                      minHeight: 34,
                                      cursor: items.length + tentItems.length > 0 ? "pointer" : "default",
                                      outline: tentShown ? "2px dashed var(--text-dim)" : "none", outlineOffset: -4,
                                    }}
                                  >
                                    {(load>0 || capacity===0 || clashes.length>0) && heatColW >= 18 && (
                                      <span style={{fontSize:Math.min(13, heatColW * 0.34), fontWeight:700, color: capacity===0 ? "var(--text-dim)" : heatFg(lvl), letterSpacing:"-0.5px", whiteSpace:"nowrap"}}>
                                        {text}
                                      </span>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          ))}
                      </div>
                    </div>

                  </div>
                  <div style={{display:"flex", gap:10, marginTop:8, alignItems:"center", flexWrap:"wrap"}}>
                    <span style={{fontSize:11, color:"var(--text-dimmer)"}}>Weekly load, % of capacity:</span>
                    {[0,1,2,3,4].map(n => (
                      <div key={n} style={{display:"flex", alignItems:"center", gap:4}}>
                        <div style={{width:18, height:18, borderRadius:3, background:heatBg(n), border:"1px solid var(--border)"}} />
                        <span style={{fontSize:11, color:"var(--text-dim)"}}>{n===0 ? "0" : n===4 ? `>${LOAD_STEPS[2]}%` : `≤${LOAD_STEPS[n-1]}%`}</span>
                      </div>
                    ))}
                    {timeOff.length > 0 && (
                      <div style={{display:"flex", alignItems:"center", gap:4, marginLeft:8}}>
                        <div style={{width:18, height:18, borderRadius:3, background:OFF_HATCH, border:"1px solid var(--border)"}} />
                        <span style={{fontSize:11, color:"var(--text-dim)"}}>time off (load is measured on days present · ⚠ task during time off)</span>
                      </div>
                    )}
                    {hasTentative && tentMode !== "hide" && (
                      <div style={{display:"flex", alignItems:"center", gap:4, marginLeft:8}}>
                        <div style={{width:18, height:18, borderRadius:3, outline:"2px dashed var(--text-dim)", outlineOffset:-4, border:"1px solid var(--border)"}} />
                        <span style={{fontSize:11, color:"var(--text-dim)"}}>{tentMode === "count" ? "includes tentative work" : "tentative work, not counted"}</span>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      </div>

      {/* EDIT MODAL */}
      {editModal && (() => {
        const accentCol = pColors[editModal.projectName] || "#3B82F6";
        return (
          <div
            onClick={e => { if (e.target === e.currentTarget) setEditModal(null); }}
            style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:16}}
          >
            <div style={{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:12, width:420, maxWidth:"100%", maxHeight:"90vh", overflowY:"auto", boxShadow:"0 24px 64px rgba(0,0,0,0.55)", display:"flex", flexDirection:"column"}}>
              {/* Coloured accent strip */}
              <div style={{height:4, background:accentCol, borderRadius:"12px 12px 0 0", flexShrink:0}} />
              <div style={{padding:"20px 22px 22px"}}>
                {/* Header */}
                <div style={{display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:18, gap:8}}>
                  <div>
                    <div style={{fontWeight:700, fontSize:15, color:"var(--text-bright)", lineHeight:1.2}}>{editModal.taskName || "Edit Task"}</div>
                    <div style={{display:"flex", alignItems:"center", gap:6, marginTop:4}}>
                      <div style={{width:8, height:8, borderRadius:2, background:accentCol, flexShrink:0}} />
                      <span style={{fontSize:12, color:"var(--text-dim)"}}>{editModal.projectName}</span>
                    </div>
                  </div>
                  <button onClick={() => setEditModal(null)} style={{background:"none", border:"none", color:"var(--text-dimmer)", cursor:"pointer", fontSize:18, lineHeight:1, padding:"0 2px", flexShrink:0, marginTop:2}}>✕</button>
                </div>

                {/* Task name */}
                <div style={{...S.label, marginBottom:5}}>TASK NAME</div>
                <input
                  value={editModal.taskName}
                  onChange={e => setEditModal({...editModal, taskName:e.target.value})}
                  onKeyDown={e => e.key==="Enter" && submitModal()}
                  style={{...S.input, marginBottom:12}}
                  autoFocus
                />

                {/* Project */}
                <div style={{...S.label, marginBottom:5}}>PROJECT</div>
                <input
                  value={editModal.projectName}
                  onChange={e => setEditModal({...editModal, projectName:e.target.value})}
                  onKeyDown={e => e.key==="Enter" && submitModal()}
                  style={{...S.input, marginBottom:12}}
                  list="modal-projects-list"
                />
                <datalist id="modal-projects-list">{projects.map(p=><option key={p} value={p}/>)}</datalist>

                {/* Resources */}
                <div style={{...S.label, marginBottom:5}}>RESOURCES</div>
                <div style={{border:"1px solid var(--border)", borderRadius:6, background:"var(--input-bg)", marginBottom:12, padding:"5px 9px", maxHeight:90, overflowY:"auto"}}>
                  {resources.map(r => (
                    <label key={r.id} style={{display:"flex", alignItems:"center", gap:7, padding:"3px 0", cursor:"pointer"}}>
                      <input type="checkbox"
                        checked={editModal.resourceIds.includes(r.id)}
                        onChange={e => {
                          const ids = e.target.checked ? [...editModal.resourceIds, r.id] : editModal.resourceIds.filter(x=>x!==r.id);
                          setEditModal({...editModal, resourceIds:ids});
                        }}
                        style={{accentColor:"#2563EB", cursor:"pointer"}}
                      />
                      <span style={{fontSize:12, color:"var(--text)"}}>{r.name}</span>
                    </label>
                  ))}
                </div>

                {/* Dates */}
                <div style={{...S.label, marginBottom:5}}>DATES</div>
                <div style={{display:"flex", gap:6, marginBottom:12}}>
                  <input type="date" lang="en-GB" value={editModal.startDate} onChange={e => setEditModal({...editModal, startDate:e.target.value})} style={{...S.input, flex:1, minWidth:0, fontSize:12}} />
                  <input type="date" lang="en-GB" value={editModal.endDate}   onChange={e => setEditModal({...editModal, endDate:e.target.value})}   style={{...S.input, flex:1, minWidth:0, fontSize:12}} />
                </div>

                {/* Tentative */}
                <label style={{display:"flex", alignItems:"center", gap:8, marginBottom:12, cursor:"pointer", fontSize:12, color:"var(--text)"}}>
                  <input type="checkbox" checked={!!editModal.tentative} onChange={e => setEditModal(m => ({...m, tentative:e.target.checked}))} style={{accentColor:"#2563EB", cursor:"pointer"}} />
                  <span style={{fontWeight:600}}>Tentative</span> <span style={{color:"var(--text-dimmer)"}}>— not confirmed yet; not counted in the heatmap unless "Count" is on</span>
                </label>

                {/* Effort */}
                <div style={{...S.label, marginBottom:5}}>EFFORT <span style={{fontWeight:400, letterSpacing:0, textTransform:"none"}}>— share of each person's time</span></div>
                <div style={{marginBottom:12}}>{renderAllocPicker(editModal.allocation, v => setEditModal(m => ({...m, allocation:v})))}</div>

                {/* Completion */}
                <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:12}}>
                  <div>
                    <div style={{...S.label, marginBottom:5}}>% COMPLETE</div>
                    <input type="number" min="0" max="100" value={editModal.completion} onChange={e => setEditModal({...editModal, completion:e.target.value})} placeholder="—" style={{...S.input, width:72, textAlign:"center"}} />
                  </div>
                  {editModal.completion !== "" && editModal.completion !== null && (
                    <div style={{flex:1, marginTop:16}}>
                      <div style={{height:5, borderRadius:3, background:"var(--border)", overflow:"hidden"}}>
                        <div style={{height:"100%", width:`${Math.min(100,parseInt(editModal.completion)||0)}%`, background:accentCol, borderRadius:3, transition:"width 0.15s"}} />
                      </div>
                    </div>
                  )}
                </div>

                {/* Notes */}
                <div style={{...S.label, marginBottom:5}}>NOTES</div>
                <textarea
                  value={editModal.notes}
                  onChange={e => setEditModal({...editModal, notes:e.target.value})}
                  placeholder="Optional notes…"
                  rows={2}
                  style={{...S.input, marginBottom:18, resize:"vertical", fontFamily:"inherit", lineHeight:1.4}}
                />

                {/* Action buttons */}
                <div style={{display:"flex", gap:8}}>
                  <button
                    onClick={() => delTaskFromModal(editModal.id)}
                    style={{padding:"8px 14px", borderRadius:6, border:"none", background:"rgba(127,29,29,0.5)", color:"#FCA5A5", fontSize:12, fontWeight:600, cursor:"pointer"}}
                  >
                    ✕ Delete
                  </button>
                  <div style={{flex:1}} />
                  <button onClick={() => setEditModal(null)} style={{padding:"8px 14px", borderRadius:6, border:"1px solid var(--border)", background:"transparent", color:"var(--text-dim)", fontSize:12, cursor:"pointer"}}>Cancel</button>
                  <button onClick={submitModal} style={{padding:"8px 18px", borderRadius:6, border:"none", background:"#2563EB", color:"#fff", fontSize:12, fontWeight:600, cursor:"pointer"}}>Save</button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* COPY LINK TOAST */}
      {copyToast && (
        <div style={{position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)", background:"#1E3A5F", border:"1px solid #2D5F8A", borderRadius:8, padding:"10px 18px", zIndex:400, boxShadow:"0 4px 16px rgba(0,0,0,0.4)", whiteSpace:"nowrap"}}>
          <span style={{fontSize:12, color:"#93C5FD", fontWeight:600}}>🔗 Share link copied to clipboard</span>
        </div>
      )}

      {/* UNDO TOAST */}
      {undoSnapshot && (
        <div style={{position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, padding:"10px 16px", display:"flex", alignItems:"center", gap:12, zIndex:200, boxShadow:"0 4px 16px rgba(0,0,0,0.4)", whiteSpace:"nowrap"}}>
          <span style={{fontSize:12, color:"var(--text)"}}>{undoSnapshot.label}</span>
          <button onClick={performUndo} style={{padding:"4px 12px", borderRadius:5, border:"none", background:"#2563EB", color:"#fff", fontSize:12, fontWeight:600, cursor:"pointer"}}>Undo</button>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
